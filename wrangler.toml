# Cloudflare Worker settings for the Fiqh assistant (used when Cloudflare builds from the
# repository root). The same settings live in fiqh-assistant-worker/wrangler.toml.
# GitHub Pages ignores this file. Contains NO secrets.
name = "ahd-fiqh-assistant"
main = "fiqh-assistant-worker/src/index.js"
compatibility_date = "2025-01-01"

[vars]
# "ai" = Zahra answers with AI grounded in sistani.org (Cloudflare Workers AI, free daily allowance).
# "retrieval" = official answers only, no AI.
MODE = "ai"
# Cloudflare Workers AI model. Other providers: set AI_PROVIDER = "gemini" or "openai" and add its key as a secret.
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# How many retrieved passages the AI reads per question.
AI_PASSAGES = "6"
# How closely an official answer must match the question to be shown (0 to 1).
MIN_RELEVANCE = "0.6"
# The website addresses allowed to call this API (comma separated).
ALLOWED_ORIGINS = "https://awaiting-the-mahdi.github.io"
# OpenAI model used for search planning and grounded explanations. Change any time.
OPENAI_MODEL = "gpt-4.1-mini"
# Leave "0" for consistent answers. Set to "" for models that do not accept a temperature.
OPENAI_TEMPERATURE = "0"
# Store the text of visitors' questions in the logs? "false" stores only retrieval data.
LOG_QUESTIONS = "false"
RATE_LIMIT_PER_HOUR = "20"
MAX_PASSAGES = "10"

[[d1_databases]]
binding = "DB"
database_name = "ahd-fiqh-assistant"
# Replace with the id printed by: npx wrangler d1 create ahd-fiqh-assistant
database_id = "e5393af9-752a-4f43-bc12-5c49587bdcf1"

# Cloudflare Workers AI (no key needed; uses the free daily allowance).
[ai]
binding = "AI"
