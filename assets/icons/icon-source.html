<!doctype html>
<!-- Source of the app icons: عهد الظهور in gold Ruqaa calligraphy inside a ring.
     Rendered to PNG by a headless browser (sizes and variants listed in tools/make-icons.js). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body>
<svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#1f3354"/><stop offset=".55" stop-color="#0c1a33"/><stop offset="1" stop-color="#050c1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d7bc80" stop-opacity=".22"/><stop offset="1" stop-color="#d7bc80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/><stop offset=".5" stop-color="#e2be72"/><stop offset="1" stop-color="#b98d3e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="art">
    <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="256" cy="256" r="184" fill="none" stroke="#d7bc80" stroke-width="1.8" opacity=".55"/>
    <!-- small eight-pointed stars at the top and bottom of the ring -->
    <g fill="url(#gold)">
      <g transform="translate(256 56)"><rect x="-9" y="-9" width="18" height="18"/><rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/></g>
      <g transform="translate(256 456)"><rect x="-9" y="-9" width="18" height="18"/><rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/></g>
    </g>
    <g fill="url(#gold)" font-family="Aref Ruqaa" font-weight="700" text-anchor="middle">
      <text x="256" y="244" font-size="150">عهد</text>
      <text x="256" y="368" font-size="132">الظهور</text>
    </g>
  </g>
</svg>
</body></html>
