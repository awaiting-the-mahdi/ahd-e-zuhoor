<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061321">
<title>The Prophetic Blueprint | AHD-E-ZUHOOR</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  width: 100%;
  background: #061321;
}

body {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-x: hidden;
  padding: 24px 0;
}

/* PAGE TITLE */
.page-heading {
  text-align: center;
  padding: 27px 12px 18px;
  background: #061321;
}

.eyebrow {
  color: #d7bc80;
  font: 500 10px/1.5 Arial, sans-serif;
  letter-spacing: .22em;
  margin-bottom: 8px;
}

.page-heading h1 {
  color: #f5ebdd;
  font: 400 clamp(25px, 4vw, 42px)/1.2 Georgia, serif;
  margin: 0;
}

.heading-line {
  width: 54px;
  height: 1px;
  background: #b99a60;
  margin: 13px auto 0;
}

/* ORIGINAL ARTWORK */
.blueprint {
  position: relative;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  line-height: 0;
  isolation: isolate;
}

.blueprint-art {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

/* CENTRE LABEL */
.imam-label {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 50%;
  width: max-content;
  padding: 3px 5px;
  color: #fff1d6;
  font: 500 clamp(8px, 1.05vw, 13px)/1.2 Georgia, serif;
  text-align: center;
  text-shadow: 0 1px 8px #24180b, 0 0 14px rgba(255,214,142,.95);
  transform: translate(-50%, 18px);
  pointer-events: none;
  white-space: nowrap;
}

/* PERMANENT PROPHET LABELS + CLICK AREAS */
.prophet-node {
  position: absolute;
  z-index: 4;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 50px;
  min-height: 34px;
  padding: 4px;
  border: 0;
  background: transparent;
  color: #f0d7a4;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-shadow: 0 1px 5px #061321, 0 0 8px #061321;
  line-height: 1.1;
}

.node-name {
  font: 500 clamp(6px, .72vw, 9px)/1.15 Georgia, serif;
  white-space: nowrap;
}

.prophet-node.muhammad .node-name {
  font-size: clamp(8px, 1.05vw, 13px);
}

.prophet-node:focus-visible {
  outline: 1px solid #e6c98e;
  outline-offset: 3px;
}

/* Positions are percentages of the original 1536 × 864 image */
.prophet-node[data-key="adam"] {
  --x: 11.1%;
  --y: 64.7%;
}

.prophet-node[data-key="nuh"] {
  --x: 37.7%;
  --y: 26.7%;
}

.prophet-node[data-key="ibrahim"] {
  --x: 28.5%;
  --y: 62.6%;
}

.prophet-node[data-key="musa"] {
  --x: 71.6%;
  --y: 49.4%;
}

.prophet-node[data-key="isa"] {
  --x: 76%;
  --y: 21.9%;
}

.prophet-node[data-key="yusuf"] {
  --x: 70.8%;
  --y: 69.9%;
}

.prophet-node[data-key="khizr"] {
  --x: 56.5%;
  --y: 78.2%;
}

.prophet-node[data-key="muhammad"] {
  --x: 87.8%;
  --y: 46.5%;
}

/* POPOVER */
#insight {
  position: fixed;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: min(390px, calc(100vw - 34px));
  max-width: none;
  margin: 0;
  padding: 27px 23px 22px;
  border: 1px solid rgba(215,188,128,.72);
  border-radius: 5px;
  background: linear-gradient(145deg, #10243a, #071525);
  color: #f5ebdd;
  box-shadow: 0 22px 70px rgba(0,0,0,.48);
  overflow: visible;
  line-height: 1.5;
}

#insight::backdrop {
  background: rgba(2,9,17,.64);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.dialog-close {
  position: absolute;
  right: 9px;
  top: 7px;
  border: 0;
  background: transparent;
  color: #d7bc80;
  font-size: 23px;
  line-height: 1;
  padding: 5px;
  cursor: pointer;
}

.question {
  margin: 0;
  color: #f5ebdd;
  font: 400 18px/1.48 Georgia, serif;
}

.question + .question {
  margin-top: 19px;
  padding-top: 17px;
  border-top: 1px solid rgba(215,188,128,.28);
}

.discover {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 23px;
  padding: 12px 14px;
  border: 0;
  border-radius: 3px;
  background: #c7a96d;
  color: #081426;
  font: 600 13px/1.2 Arial, sans-serif;
  cursor: pointer;
}

.discover span {
  font-size: 18px;
}

@media (max-width: 600px) {
  .prophet-node {
    min-width: 42px;
    min-height: 30px;
  }

  .node-name {
    font-size: 6px;
  }

  .prophet-node.muhammad .node-name {
    font-size: 8px;
  }

  .imam-label {
    font-size: 8px;
    transform: translate(-50%, 14px);
  }

  #insight {
    padding: 25px 20px 19px;
  }

  .question {
    font-size: 16px;
  }
}
/* Improved Prophet label readability */
.prophet-node .node-name {
  font-size: 9px;
  color: #f3dcae;
  text-shadow:
    0 1px 4px #061321,
    0 0 7px #061321;
}

.prophet-node.muhammad .node-name {
  font-size: 13px;
}

@media (max-width: 600px) {
  .prophet-node .node-name {
    font-size: 7px !important;
  }

  .prophet-node.muhammad .node-name {
    font-size: 8px !important;
  }
}

/* LIVING CONSTELLATION — subtle ambient lighting */

/* Gentle breathing glow around the eight selected nodes */
.prophet-node {
  isolation: isolate;
  animation: node-breathe 4.5s ease-in-out infinite;
}

.prophet-node::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 2px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 213, 139, 0.28) 0%,
    rgba(255, 190, 100, 0.12) 42%,
    transparent 75%
  );
  filter: blur(5px);
  opacity: 0.55;
  pointer-events: none;
  animation: node-halo 4.5s ease-in-out infinite;
}

@keyframes node-breathe {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.18); }
}

@keyframes node-halo {
  0%, 100% { opacity: 0.35; transform: scale(.88); }
  50% { opacity: .85; transform: scale(1.25); }
}

/* The Imam remains the brightest point */
.imam-label {
  isolation: isolate;
  animation: imam-radiance 4s ease-in-out infinite;
}

.imam-label::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -15px -22px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    rgba(255, 211, 135, .32),
    rgba(255, 190, 100, .10) 48%,
    transparent 75%
  );
  filter: blur(9px);
  pointer-events: none;
}

@keyframes imam-radiance {
  0%, 100% { text-shadow: 0 1px 8px #24180b, 0 0 14px rgba(255,214,142,.75); }
  50% { text-shadow: 0 1px 10px #24180b, 0 0 22px rgba(255,214,142,1); }
}

/* Very subtle golden atmosphere, separate from the original image */
.blueprint::after {
  content: "";
  position: absolute;
  z-index: 2;
  inset: 0;
  pointer-events: none;
  opacity: .16;
  background-image:
    radial-gradient(circle at 18% 24%, rgba(255,220,160,.8) 0 1px, transparent 2px),
    radial-gradient(circle at 82% 31%, rgba(255,220,160,.7) 0 1px, transparent 2px),
    radial-gradient(circle at 45% 83%, rgba(255,220,160,.7) 0 1px, transparent 2px),
    radial-gradient(circle at 91% 76%, rgba(255,220,160,.6) 0 1px, transparent 2px);
  animation: constellation-atmosphere 12s ease-in-out infinite alternate;
}

@keyframes constellation-atmosphere {
  from { opacity: .08; }
  to { opacity: .24; }
}

/* Respect reduced-motion settings */
@media (prefers-reduced-motion: reduce) {
  .prophet-node,
  .prophet-node::before,
  .imam-label,
  .imam-label::before,
  .blueprint::after {
    animation: none !important;
  }
}

/* Selected Prophet — focused golden illumination */
.prophet-node.is-selected {
  z-index: 6;
  color: #fff2d2;
  filter: brightness(1.35);
}

.prophet-node.is-selected::before {
  opacity: 1;
  transform: scale(1.8);
  background: radial-gradient(
    circle,
    rgba(255, 230, 177, .55) 0%,
    rgba(230, 183, 105, .28) 42%,
    rgba(230, 183, 105, .08) 68%,
    transparent 78%
  );
  filter: blur(7px);
  animation: selected-glow 1.8s ease-in-out infinite;
}

@keyframes selected-glow {
  0%, 100% { opacity: .72; transform: scale(1.45); }
  50% { opacity: 1; transform: scale(1.95); }
}

/* A travelling light sweep over the original network */
.network-light-sweep {
  position: absolute;
  z-index: 2;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.network-light-sweep::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -45%;
  width: 35%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 218, 155, .035) 30%,
    rgba(255, 226, 175, .15) 50%,
    rgba(255, 218, 155, .035) 70%,
    transparent
  );
  filter: blur(8px);
  transform: skewX(-18deg);
  animation: network-light-travel 13s ease-in-out infinite;
}

@keyframes network-light-travel {
  0%, 12% { left: -45%; opacity: 0; }
  22% { opacity: .8; }
  75% { opacity: .8; }
  88%, 100% { left: 115%; opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .network-light-sweep::before {
    animation: none;
  }
}

body {

/* BACKGROUND MATCH — sampled from original artwork */

html,
body {
  background-color: #010914 !important;
}

body {
  background-image:

/* FULL-PAGE ORIGINAL-PALETTE NEBULA BACKGROUND */

html,

body {
  background-image:

      rgba(2, 12, 23, .12),

/* FINAL POLISH — seamless artwork edge + central radiance */

/* Blend the bottom edge into the page background */

/* Seamless fade — dissolve the artwork's bottom edge */

    to bottom,

/* Imam Mahdi (ATFS) — brightest star */
.imam-label::before {
  background: radial-gradient(
    ellipse,
    rgba(255, 225, 164, .58) 0%,
    rgba(255, 204, 125, .28) 38%,
    rgba(230, 183, 105, .10) 62%,
    transparent 78%
  );
  animation: imam-star-twinkle 3.2s ease-in-out infinite;

@keyframes imam-star-twinkle {
  0%, 100% {
    opacity: .68;
    transform: scale(.92);
    filter: blur(9px);
  }
  50% {
    opacity: 1;
    transform: scale(1.42);
    filter: blur(12px);
  }

@media (prefers-reduced-motion: reduce) {
  .imam-label::before {
    animation: none !important;
  }

/* No scanning beam */

  display: none !important;
}

/* Independent star-like shimmer */

  animation: star-twinkle 2.8s ease-in-out infinite !important;
}

.prophet-node[data-key="adam"]::before { animation-delay: .2s !important; }
.prophet-node[data-key="nuh"]::before { animation-delay: 1.1s !important; }
.prophet-node[data-key="ibrahim"]::before { animation-delay: .6s !important; }

<body>

<header class="page-heading">
  <div class="eyebrow">THE PROPHETIC LEGACY</div>
  <h1>The Prophetic Blueprint</h1>
  <div class="heading-line"></div>
</header>

<main class="blueprint" aria-label="Interactive Prophetic Blueprint">

  <!-- DO NOT CHANGE OR REPLACE THIS ORIGINAL IMAGE -->
  <img
    class="blueprint-art"
    src="../assets/images/prophetic-blueprint-network.PNG"
    width="1536"
    height="864"
    alt="A luminous golden network of interconnected points"
    draggable="false"
  >




  <span class="imam-label">Imam Mahdi (ATFS)</span>

  <button class="prophet-node" type="button" data-key="adam">
    <span class="node-name">Adam (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="nuh">
    <span class="node-name">Nuh (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="ibrahim">
    <span class="node-name">Ibrahim (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="musa">
    <span class="node-name">Musa (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="isa">
    <span class="node-name">Isa (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="yusuf">
    <span class="node-name">Yusuf (AS)</span>
  </button>

  <button class="prophet-node" type="button" data-key="khizr">
    <span class="node-name">Khizr (AS)</span>
  </button>

  <button class="prophet-node muhammad" type="button" data-key="muhammad">
    <span class="node-name">Muhammad (SAWW)</span>
  </button>

</main>

<!-- THE POPOVER -->
<dialog id="insight">

  <button class="dialog-close" type="button" aria-label="Close">×</button>

  <p class="question" id="laqab-question"></p>

  <p class="question" id="resemblance-question"></p>

  <button class="discover" type="button" id="discover">
    Discover the Answer <span aria-hidden="true">→</span>
  </button>

</dialog>

<script>
(() => {

  const prophets = {
    adam: {
      name: "Prophet Adam (AS)",
      laqab: "Safiyullah",
      slug: "adam"
    },
    nuh: {
      name: "Prophet Nuh (AS)",
      laqab: "Najiyullah",
      slug: "nuh"
    },
    ibrahim: {
      name: "Prophet Ibrahim (AS)",
      laqab: "Khalilullah",
      slug: "ibrahim"
    },
    musa: {
      name: "Prophet Musa (AS)",
      laqab: "Kalimullah",
      slug: "musa"
    },
    isa: {
      name: "Prophet Isa (AS)",
      laqab: "Ruhullah",
      slug: "isa"
    },
    yusuf: {
      name: "Prophet Yusuf (AS)",
      laqab: "Al-Siddiq",
      slug: "yusuf"
    },
    khizr: {
      name: "Prophet Khizr (AS)",
      laqab: "Al-Abd al-Salih",
      slug: "khizr"
    },
    muhammad: {
      name: "Prophet Muhammad (SAWW)",
      laqab: "Habibullah",
      slug: "muhammad"
    }
  };

  const dialog = document.getElementById("insight");
  const nodes = document.querySelectorAll(".prophet-node");
  let selectedProphet = null;

  nodes.forEach(node => {

    node.addEventListener("click", () => {

      selectedProphet = prophets[node.dataset.key];
nodes.forEach(item => item.classList.remove("is-selected"));
node.classList.add("is-selected");
      document.getElementById("laqab-question").textContent =
        "Do you know why " + selectedProphet.name +
        " is known by the laqab " + selectedProphet.laqab + "?";

      document.getElementById("resemblance-question").textContent =
        "Do you know the resemblance between " +
        selectedProphet.name + " and our Imam (ATFS)?";

      dialog.showModal();

    });

  });

  document.querySelector(".dialog-close").addEventListener("click", () => {
    dialog.close();
  });
dialog.addEventListener("close", () => {
  nodes.forEach(item => item.classList.remove("is-selected"));
});
  dialog.addEventListener("click", event => {
    if (event.target === dialog) {
      dialog.close();
    }
  });

  document.getElementById("discover").addEventListener("click", () => {

    if (selectedProphet) {
      window.location.href =
        "prophet.html?name=" + encodeURIComponent(selectedProphet.slug);
    }

  });

})();
</script>

</body>
</html>
