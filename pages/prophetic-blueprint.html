<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081426">
  <meta name="description" content="Explore the Prophetic Legacy through an interactive constellation of Prophets.">
  <title>The Prophetic Blueprint | AHD-E-ZUHOOR</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #061321; }
    body { min-height: 100svh; display: grid; place-items: center; overflow-x: hidden; }
    .blueprint { position: relative; width: 100%; max-width: 1920px; line-height: 0; isolation: isolate; }
    .blueprint-art { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
    .hotspot {
      position: absolute; z-index: 2; display: block;
      width: clamp(34px, 5.2vw, 76px); height: clamp(34px, 5.2vw, 76px);
      padding: 0; border: 1px solid transparent; border-radius: 50%;
      background: transparent; color: #f7edda; text-decoration: none;
      transform: translate(-50%, -50%); cursor: pointer; -webkit-tap-highlight-color: transparent;
      line-height: normal;
    }
    .hotspot::after {
      content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 9px);
      width: max-content; max-width: min(190px, 48vw); padding: 8px 11px;
      border: 1px solid rgba(215,188,128,.52); border-radius: 2px;
      background: rgba(5,15,28,.94); color: #f5ead5;
      font: 500 12px/1.3 Georgia, serif; letter-spacing: .035em; white-space: nowrap;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translate(-50%, 4px); transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
    }
    .hotspot:hover::after, .hotspot:focus-visible::after, .hotspot.is-selected::after {
      opacity: 1; visibility: visible; transform: translate(-50%, 0);
    }
    .hotspot:focus-visible { outline: 1px solid rgba(242,211,150,.9); outline-offset: 2px; background: rgba(215,188,128,.08); }
    /* Hotspots are positioned against the original 1536 × 864 artwork. */
    .hotspot[data-name="Adam (AS)"] { left: 11.1%; top: 64.7%; }
    .hotspot[data-name="Nuh (AS)"] { left: 37.7%; top: 26.7%; }
    .hotspot[data-name="Ibrahim (AS)"] { left: 28.5%; top: 62.6%; }
    .hotspot[data-name="Musa (AS)"] { left: 71.6%; top: 49.4%; }
    .hotspot[data-name="Isa (AS)"] { left: 76%; top: 21.9%; }
    .hotspot[data-name="Yusuf (AS)"] { left: 70.8%; top: 69.9%; }
    .imam-label {
      position: absolute; z-index: 3; left: 50.1%; top: 50%; width: max-content; max-width: 30%;
      padding: 4px 8px; color: #fff1d6;
      font: 500 clamp(8px, 1.05vw, 13px)/1.2 Georgia, serif;
      letter-spacing: .045em; text-align: center;
      text-shadow: 0 1px 8px #24180b, 0 0 14px rgba(255,214,142,.95);
      transform: translate(-50%, 23px); pointer-events: none; white-space: nowrap;
    }
    @media (max-width: 600px) {
      .hotspot { width: 38px; height: 38px; }
      .hotspot::after { font-size: 11px; padding: 7px 9px; }
      .imam-label { font-size: 8px; transform: translate(-50%, 14px); letter-spacing: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .hotspot::after { transition: none; } }
 .page-heading {
  text-align: center;
  padding: 42px 16px 28px;
  background: #061321;
}

.page-heading .eyebrow {
  color: #d7bc80;
  font: 500 11px/1.5 Arial, sans-serif;
  letter-spacing: 0.22em;
  margin-bottom: 10px;
}

.page-heading h1 {
  color: #f5ebdd;
  font: 400 clamp(25px, 4vw, 42px)/1.2 Georgia, serif;
  margin: 0;
}

.heading-line {
  width: 54px;
  height: 1px;
  background: #b99a60;
  margin: 20px auto 0;
}

@media (max-width: 600px) {
  .page-heading {
    padding: 32px 12px 22px;
  }
}
   </style>
</head>
<body>
<body>
  <header class="page-heading">
    <div class="eyebrow">THE PROPHETIC LEGACY</div>
    <h1>The Prophetic Blueprint</h1>
    <div class="heading-line"></div>
  </header>

  <main class="blueprint" aria-label="Interactive Prophetic Blueprint">
    <img class="blueprint-art"
      src="../assets/images/prophetic-blueprint-network.PNG"
      width="1536" height="864"
      alt="A luminous golden network of interconnected points on a midnight-blue background"
      draggable="false">
    <span class="imam-label">Imam Mahdi (ATFS)</span>
    <a class="hotspot" href="prophet.html?name=adam" data-name="Adam (AS)" aria-label="Explore Prophet Adam (AS)"></a>
    <a class="hotspot" href="prophet.html?name=nuh" data-name="Nuh (AS)" aria-label="Explore Prophet Nuh (AS)"></a>
    <a class="hotspot" href="prophet.html?name=ibrahim" data-name="Ibrahim (AS)" aria-label="Explore Prophet Ibrahim (AS)"></a>
    <a class="hotspot" href="prophet.html?name=musa" data-name="Musa (AS)" aria-label="Explore Prophet Musa (AS)"></a>
    <a class="hotspot" href="prophet.html?name=isa" data-name="Isa (AS)" aria-label="Explore Prophet Isa (AS)"></a>
    <a class="hotspot" href="prophet.html?name=yusuf" data-name="Yusuf (AS)" aria-label="Explore Prophet Yusuf (AS)"></a>
  </main>
  <script>
    (() => {
      const hotspots = document.querySelectorAll(".hotspot");
      const touchMode = window.matchMedia("(hover: none) and (pointer: coarse)");
      hotspots.forEach((hotspot) => {
        hotspot.addEventListener("click", (event) => {
          if (!touchMode.matches) return;
          if (!hotspot.classList.contains("is-selected")) {
            event.preventDefault();
            hotspots.forEach((item) => item.classList.remove("is-selected"));
            hotspot.classList.add("is-selected");
          }
        });
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".hotspot")) hotspots.forEach((item) => item.classList.remove("is-selected"));
      });
    })();
  </script>
</body>
</html>
