<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Muntazir Athenaeum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IM+Fell+English:ital@0;1&family=Cinzel+Decorative:wght@700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--bg1:#0f1a4b;--bg2:#040614;--ink:#efe9ff;--mut:#a09fcb;--star:255,255,255;--acc:#e8b85c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);
--d:'Fraunces',Georgia,serif;--ar:'Aref Ruqaa','Amiri',serif;--b:'Newsreader',Georgia,serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#f6eedc;--bg2:#dccfb2;--ink:#2a2233;--mut:#6d6280;--star:90,70,120;--acc:#a8641a;--card:rgba(255,255,255,.55);--line:rgba(42,34,51,.18);color-scheme:light}}
:root[data-theme="dark"]{--bg1:#0f1a4b;--bg2:#040614;--ink:#efe9ff;--mut:#a09fcb;--star:255,255,255;--acc:#e8b85c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2) 75%) fixed;color:var(--ink);font-family:var(--b);overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:7vh 20px 80px}
.eye{letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--acc);text-align:center}
h1{font:300 clamp(40px,10vw,92px)/1 var(--d);text-align:center;margin:.2em 0 .15em;letter-spacing:-.02em}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--acc),#ff8fb1,#8fd3ff,var(--acc));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{text-align:center;color:var(--mut);font-size:clamp(16px,3.6vw,21px);font-style:italic;max-width:560px;margin:0 auto 28px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:44px}
.chip,.srch,.surp{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:40px;padding:9px 18px;font:15px var(--b);cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.chip:hover,.surp:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:#1a1530;border-color:var(--acc)}
.srch{cursor:text;outline:none;width:170px}
.surp{font-style:italic;color:var(--acc)}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:34px 22px}
.bk{cursor:pointer;opacity:0;transform:translateY(30px);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px 9px 9px 3px;overflow:hidden;transform:perspective(700px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .25s,box-shadow .3s;
box-shadow:0 18px 30px -12px rgba(0,0,0,.65),inset 5px 0 8px rgba(0,0,0,.4)}
.bk:hover .cv{box-shadow:0 30px 50px -14px hsl(var(--h) 90% 55%/.55),inset 5px 0 8px rgba(0,0,0,.4)}
.cv svg{position:absolute;inset:0;width:100%;height:100%}
.cv::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 55%);opacity:0;transition:.3s;mix-blend-mode:overlay}
.bk:hover .cv::after{opacity:1}
.ti{position:absolute;left:0;right:0;bottom:0;padding:34% 12% 11%;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff6e0}
.ti small{display:block;letter-spacing:.3em;text-transform:uppercase;font-size:9px;opacity:.8;margin-bottom:5px}
.ti b{font:600 clamp(15px,3.6vw,19px)/1.12 var(--d)}
.meta{margin-top:12px;color:var(--mut);font-size:14px;text-align:center;font-style:italic}
.meta s{text-decoration:none;color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);font-style:italic}
/* reader */
#rd{--rbg:#0c0e24;--rink:#e9e4f7;--rm:#9a97c4;position:fixed;inset:0;z-index:10;background:var(--rbg);color:var(--rink);clip-path:circle(0 at 50% 50%);visibility:hidden;transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s .9s}
#rd.open{clip-path:circle(160% at var(--ox) var(--oy));visibility:visible;transition:clip-path 1s cubic-bezier(.6,0,.2,1),visibility 0s}
#rd.paper{--rbg:#f4ead3;--rink:#2c2418;--rm:#7a6a4e}
#bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:3;background:rgba(128,128,128,.2)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb1,var(--acc))}
.rh{position:absolute;top:3px;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:linear-gradient(var(--rbg) 60%,transparent)}
.rh span{flex:1;text-align:center;font:italic 15px var(--d);color:var(--rm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh button{border:1px solid currentColor;background:none;color:var(--rm);border-radius:30px;min-width:40px;height:38px;padding:0 12px;font:16px var(--b);cursor:pointer;opacity:.85}
.rh button:hover{color:var(--acc);opacity:1}
#sc{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;padding:calc(env(safe-area-inset-top,0px) + 70px) 22px calc(env(safe-area-inset-bottom,0px) + 90px)}
#tx{--fs:21px;max-width:660px;margin:0 auto;font-size:var(--fs);line-height:1.75}
.hero{text-align:center;margin-bottom:70px}
.hero .cv{width:150px;margin:0 auto 26px}
.hero h2{font:300 clamp(34px,8vw,56px)/1.05 var(--d);margin:0 0 8px}
.hero p{color:var(--rm);font-style:italic;margin:0}
.chn{text-align:center;margin:90px 0 36px}
.chn i{display:block;font:300 80px/1 var(--d);color:var(--acc);opacity:.9}
.chn h3{font:600 28px var(--d);margin:6px 0 0}
.chn::after{content:"❦";display:block;color:var(--rm);margin-top:14px}
#tx p{margin:0 0 1.2em;opacity:0;transform:translateY(18px);transition:.9s cubic-bezier(.2,.8,.2,1)}
#tx p.in{opacity:1;transform:none}
#tx p.f::first-letter{float:left;font:600 3.5em/.8 var(--d);color:var(--acc);padding:.06em .1em 0 0}
.fin{text-align:center;margin:90px 0 30px}
.fin h3{font:italic 300 34px var(--d);margin:0 0 20px}
.nx{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:40px;padding:12px 26px;font:italic 18px var(--b);cursor:pointer;transition:.25s}
.nx:hover{background:var(--acc);color:#1a1530}
#res{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translate(-50%,120px);z-index:3;background:var(--acc);color:#1a1530;border:0;border-radius:40px;padding:11px 22px;font:italic 16px var(--b);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,.9,.3,1.3)}
#res.show{transform:translate(-50%,0)}
.views{display:flex;gap:10px;justify-content:center;margin:0 0 18px}
.vw{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:40px;padding:9px 20px;font:15px var(--b);cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.vw.on{background:var(--acc);color:#1a1530;border-color:var(--acc)}
#map{display:none;position:relative;height:min(78vh,640px);margin-top:10px}
#map.on{display:block}
#map svg.ln{position:absolute;inset:0;width:100%;height:100%}
#map line{stroke:rgba(var(--star),.3);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:4 6;animation:dash 20s linear infinite;transition:.3s}
#map line.hi{stroke:var(--acc);stroke-width:2.4}
@keyframes dash{to{stroke-dashoffset:-200}}
.nd{position:absolute;transform:translate(-50%,-50%);width:clamp(62px,13vw,96px);cursor:pointer;text-align:center;background:none;border:0;color:var(--ink);font:13px/1.2 var(--b);padding:0}
.nd .o{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px hsl(var(--h) 80% 70%/.8),0 0 30px hsl(var(--h) 90% 60%/.6);animation:pulse 4s ease-in-out infinite;animation-delay:calc(var(--n)*-.7s);transition:transform .3s}
.nd:hover .o{transform:scale(1.18)}
.nd .o svg{width:100%;height:100%;display:block}
.nd .tt{display:block;margin-top:6px}
@keyframes pulse{50%{box-shadow:0 0 0 2px hsl(var(--h) 80% 70%/.8),0 0 48px hsl(var(--h) 95% 65%/.9)}}
#cap{position:absolute;left:0;right:0;bottom:0;text-align:center;color:var(--mut);font-style:italic;min-height:1.5em;font-size:15px}
#bkv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#3a2614,#120a05 85%)}
#rd.bm{--rbg:#120a05;--rm:#c9a56b}
#rd.bm #bkv{display:flex}#rd.bm #sc,#rd.bm #fm,#rd.bm #fp,#rd.bm #th{display:none}#rd.bm .rh{background:none}
#scn{--pw:min(45vw,50vh,380px);perspective:2600px;width:calc(var(--pw)*2);height:calc(var(--pw)*1.42);position:relative;margin-bottom:30px}
#bo{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.25,1);filter:drop-shadow(0 30px 36px rgba(0,0,0,.8))}
.lf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.5,.05,.2,1)}
.lf.f{transform:rotateY(-180deg)}
.fc{--gd:90deg;position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc.b{transform:rotateY(180deg);--gd:270deg}
.fc::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(var(--gd),rgba(30,15,0,.65),transparent 70%)}
.lf.tn .fc::after{animation:shd 1.3s ease-in-out}
@keyframes shd{0%,100%{opacity:0}50%{opacity:.85}}
.fc.pa{padding:12% 11%;color:#3b2a14;font-family:'IM Fell English',Georgia,serif;border-radius:2px 5px 5px 2px;background:radial-gradient(ellipse at 30% 15%,rgba(255,255,255,.4),transparent 55%),radial-gradient(circle at 88% 92%,rgba(120,70,20,.4),transparent 40%),radial-gradient(circle at 8% 70%,rgba(120,80,30,.22),transparent 30%),linear-gradient(var(--gd),#c4a064,#e4cb94 9%,#ebd8a8 92%,#d2b278);box-shadow:inset 0 0 40px rgba(110,70,20,.5)}
.fc.pa.b{border-radius:5px 2px 2px 5px}
.fc.pa::before{content:'';position:absolute;inset:5%;border:1px solid rgba(110,60,20,.5);box-shadow:0 0 0 3px rgba(110,60,20,.12);pointer-events:none}
.pa h4{font:700 calc(var(--pw)*.07)/1.15 'Cinzel Decorative',serif;text-align:center;margin:.5em 0;color:#4a2a0c}
.pa p{font-size:calc(var(--pw)*.058);line-height:1.5;text-align:justify;margin:.45em 0}
.pa p.f::first-letter{float:left;font:700 3.3em/.8 'Cinzel Decorative',serif;color:#9b1c1c;padding:.06em .08em 0 0}
.pa .ctr{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.3em}
.pa .kk{letter-spacing:.35em;text-transform:uppercase;font-size:calc(var(--pw)*.04);color:#7a5a2a}
.pa .bg{font:700 calc(var(--pw)*.26)/1 'Cinzel Decorative',serif;color:#9b1c1c}
.pa .dia{width:calc(var(--pw)*.07);aspect-ratio:1;border:1.5px solid #9b1c1c;transform:rotate(45deg);margin:.7em 0}
.pa i{font-size:calc(var(--pw)*.05)}
.pa .nm{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-size:calc(var(--pw)*.045);color:#7a5a2a}
.pa .ln{display:flex;gap:6px;align-items:baseline;margin:.8em 0;font-size:calc(var(--pw)*.052)}
.pa .ln u{flex:1;order:1;border-bottom:1px dotted #7a5a2a;text-decoration:none}.pa .ln em{order:2}
.fc.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7%;text-align:center;border-radius:3px 9px 9px 3px;background:repeating-linear-gradient(37deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px),radial-gradient(circle at 30% 25%,hsl(var(--h) 40% 30%),hsl(var(--h) 45% 11%));box-shadow:inset 0 0 50px rgba(0,0,0,.7)}
.fc.lc.b{border-radius:9px 3px 3px 9px}
.fc.lc::before{content:'';position:absolute;inset:5%;border:2px solid #d8b25a;box-shadow:inset 0 0 0 5px rgba(0,0,0,.25),inset 0 0 0 6px #d8b25a99}
.med{width:50%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #d8b25a;box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 0 6px #d8b25a}
.med svg{width:100%;height:100%;display:block}
.lt{padding:0 12%}.lt small{letter-spacing:.3em;font-size:calc(var(--pw)*.035);color:#d8b25a;text-transform:uppercase}
.lt b{display:block;font:700 calc(var(--pw)*.085)/1.15 'Cinzel Decorative',serif;background:linear-gradient(#fff0b3,#c9962d,#f5d98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.mb{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,hsl(var(--h) 60% 35%) 0 6px,hsl(calc(var(--h) + 30) 50% 55%) 6px 12px,#e8d3a0 12px 15px);opacity:.9}
.sp{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(0,0,0,.3);box-shadow:0 0 18px 6px rgba(0,0,0,.25);pointer-events:none}
.bn{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;gap:14px;justify-content:center;align-items:center;color:#c9a56b;font-style:italic}
.bn button{border:1px solid #c9a56b;background:rgba(20,10,0,.6);color:#e8c98a;border-radius:30px;padding:9px 20px;font:16px var(--b);cursor:pointer}
.bn button:disabled{opacity:.3}
#bi{min-width:110px;text-align:center}
#rd.cn::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle at 50% 45%,rgba(255,190,90,.16),rgba(0,0,0,.78) 78%);animation:fl 3.1s infinite}
@keyframes fl{0%,100%{opacity:.9}20%{opacity:1}45%{opacity:.78}70%{opacity:.96}}
@media (max-width:520px){.rh span{display:none}.rh{justify-content:flex-end}.rh #x{margin-right:auto}}

.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ti .arb{display:block;font:400 clamp(20px,5vw,26px)/1.25 var(--ar);color:#ffe9b0;margin-bottom:3px}
.lt .arb{display:block;font:400 calc(var(--pw)*.1)/1.2 var(--ar);color:#ffe9b0;margin:.2em 0}
.fi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc.lc.im::before{display:none}
.pa p{font-size:calc(var(--pw)*.052);line-height:1.42}
.pa .rt{font:italic calc(var(--pw)*.045)/1.2 'IM Fell English',serif;text-align:center;color:#7a5a2a;margin:0 0 .7em;padding-bottom:.4em;border-bottom:1px solid rgba(110,60,20,.3)}
.pa h4{font-size:calc(var(--pw)*.058)}

main{max-width:1240px;padding-top:84px}
main>section{display:none}main>section.on{display:block}
#top{position:fixed;top:0;left:0;right:0;z-index:6;height:60px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(rgba(5,8,28,.95),rgba(5,8,28,.7));border-bottom:1px solid rgba(232,184,92,.35);backdrop-filter:blur(10px)}
.brand{font:700 15px var(--d);letter-spacing:.14em;color:#e8b85c;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;justify-content:center;scrollbar-width:none}
.tab{background:none;border:1px solid transparent;color:#eadfc4;padding:8px 14px;border-radius:10px;font:15px var(--b);cursor:pointer;white-space:nowrap;transition:.25s}
.tab:hover{color:#e8b85c}.tab.on{border-color:#e8b85c;color:#e8b85c;background:rgba(232,184,92,.1)}
.ic{background:rgba(255,255,255,.08);border:1px solid rgba(232,184,92,.4);color:#e8b85c;width:40px;height:34px;border-radius:20px;font-size:17px;cursor:pointer}
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .6s}
.moon{position:absolute;right:7vw;top:90px;width:clamp(34px,5vw,62px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfe0ff 60%,#8aa6d8);box-shadow:0 0 40px 10px rgba(170,200,255,.45)}
.shl{position:absolute;left:0;top:64px;width:min(15vw,220px);height:56vh;opacity:.5;background:repeating-linear-gradient(90deg,#3b2414 0 10px,#1d1008 10px 12px,#52341c 12px 22px,#241409 22px 24px,#6b4423 24px 29px,#2c1a0d 29px 31px);-webkit-mask-image:linear-gradient(90deg,#000 35%,transparent);mask-image:linear-gradient(90deg,#000 35%,transparent)}
.cty{position:absolute;right:0;bottom:12vh;width:min(34vw,420px);opacity:.85}
.cur{position:absolute;right:0;top:0;bottom:0;width:7vw;background:linear-gradient(270deg,rgba(14,22,90,.85),transparent)}
.lan{position:absolute;bottom:4vh;width:40px;height:62px;border-radius:12px 12px 6px 6px;background:radial-gradient(circle at 50% 55%,#ffe7a3,#d28a1c 60%,#5b3508);box-shadow:0 0 60px 24px rgba(255,170,60,.4);animation:fl 3.2s infinite}
.l1{left:3vw}.l2{right:4vw;bottom:6vh}
:root[data-theme="light"] .decor{opacity:.12}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .decor{opacity:.12}}
.eye{letter-spacing:.45em;text-transform:uppercase;font-size:13px;color:var(--ink);text-align:center}
h1{font:italic 600 clamp(38px,8.5vw,84px)/1.05 var(--d);background:linear-gradient(180deg,#ffe6a8,#e8b85c 55%,#b9822a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.1em 0}
.sub{font-size:clamp(15px,3vw,19px)}
.sh{font:italic 600 clamp(30px,6vw,46px) var(--d);text-align:center;color:var(--acc);margin:10px 0}
.srow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px auto 10px;max-width:980px}
.sbox{flex:1 1 280px;display:flex;align-items:center;gap:10px;border:1px solid var(--acc);border-radius:40px;padding:0 18px;background:rgba(5,8,28,.55);color:var(--acc);font-size:20px}
.sbox input{flex:1;background:none;border:0;outline:0;color:#f3e8d0;font:16px var(--b);padding:12px 0}
.srow select,.gb{border:1px solid rgba(232,184,92,.55);background:rgba(5,8,28,.6);color:#f3e8d0;border-radius:40px;padding:11px 18px;font:15px var(--b);cursor:pointer}
.gb{color:var(--acc);border-color:var(--acc)}.gb:hover{background:var(--acc);color:#10152f}
#cf{--bw:clamp(118px,15.5vw,190px);position:relative;height:calc(var(--bw)*1.5 + 96px);perspective:1500px;margin:22px 0 4px;touch-action:pan-y}
#cf .bk{position:absolute;left:50%;top:0;width:var(--bw);margin-left:calc(var(--bw)/-2);animation:none;opacity:1;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.cv::before{content:'';position:absolute;inset:5%;z-index:2;pointer-events:none;border:1.5px solid rgba(232,190,100,.9);box-shadow:inset 0 0 0 4px rgba(0,0,0,.18),inset 0 0 0 5px rgba(232,190,100,.5)}
.cv.im::before{display:none}
.mt{margin-top:10px;text-align:center;font-size:14px;line-height:1.25;color:#f3e8d0}
.mt b{display:block;font-weight:600}.mt small{display:block;color:var(--mut);font-style:italic;font-size:12px;margin:2px 0 6px}
.pb{height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#c98a2a,#ffd27a)}
.mt span{font-size:12px;color:var(--mut)}
.now{text-align:center;color:var(--acc);font:italic 18px var(--d);min-height:1.5em}
.strip{display:flex;flex-wrap:wrap;justify-content:center;max-width:860px;margin:14px auto 0;border:1px solid rgba(232,184,92,.4);border-radius:14px;background:rgba(5,8,28,.65);backdrop-filter:blur(8px)}
.strip button{flex:1 1 120px;background:none;border:0;color:#eadfc4;padding:14px 8px;font:14px/1.25 var(--b);cursor:pointer;transition:.25s}
.strip button:hover{color:var(--acc);background:rgba(232,184,92,.08)}
.strip i{display:block;font-style:normal;font-size:24px;color:var(--acc);margin-bottom:4px}
.dua{text-align:center;font:400 clamp(28px,6vw,44px)/1.5 var(--ar);color:var(--acc);margin:26px 0 10px;text-shadow:0 0 18px rgba(232,184,92,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.tile{border:1px solid rgba(232,184,92,.4);background:rgba(5,8,28,.6);color:#f3e8d0;border-radius:14px;padding:18px;cursor:pointer;text-align:left;font:16px var(--b);backdrop-filter:blur(6px);transition:.25s}
.tile:hover{border-color:var(--acc);transform:translateY(-3px)}.tile b{display:block;color:var(--acc);font:600 20px var(--d);margin-bottom:4px}.tile .pb{margin:10px 0 4px}
@media (max-width:720px){.brand span{display:none}.tab{padding:8px 10px;font-size:14px}.shl,.lan{display:none}.cty{width:60vw;opacity:.5}}
@media (max-width:520px){.rh button{min-width:34px;padding:0 8px}.rh{gap:4px}}

:root{--bw:min(54vw,232px)}
@media (min-width:900px){:root{--bw:clamp(190px,18vw,260px)}}
main{max-width:1100px;padding-top:78px;padding-bottom:50px}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);animation:dr 16s ease-in-out infinite alternate}
.a1{width:60vmax;height:60vmax;left:-20vmax;top:-10vmax;background:radial-gradient(#3a46c8,transparent 65%);opacity:.55}
.a2{width:50vmax;height:50vmax;right:-18vmax;top:20vh;background:radial-gradient(#1d8f9e,transparent 65%);opacity:.35;animation-delay:-5s}
.a3{width:45vmax;height:45vmax;left:10vw;bottom:-22vmax;background:radial-gradient(#b9822a,transparent 65%);opacity:.3;animation-delay:-9s}
@keyframes dr{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
.moon{position:absolute;right:16px;top:72px;width:26px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfe0ff 60%,#8aa6d8);box-shadow:0 0 26px 6px rgba(170,200,255,.45);animation:fl2 7s ease-in-out infinite}
.cty{position:absolute;right:0;bottom:0;width:min(80vw,560px);opacity:.4}
:root[data-theme="light"] .bgfx{opacity:.35}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .bgfx{opacity:.35}}
.eye{font-size:11px;letter-spacing:.34em;animation:up .9s both}
h1{font:italic 600 clamp(40px,11vw,82px)/1.02 var(--d);text-align:center;background:linear-gradient(100deg,#b9822a,#ffe6a8,#e8b85c,#ffe6a8,#b9822a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;margin:.12em 0 .15em;animation:shine 7s linear infinite,up 1s .1s both}
@keyframes shine{to{background-position:250% 0}}

.sub{max-width:520px;margin:0 auto 18px;animation:up 1s .25s both}
.sbox{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto 12px;border:1px solid var(--acc);border-radius:40px;padding:0 18px;background:rgba(5,8,28,.55);color:var(--acc);font-size:20px;animation:up 1s .35s both;backdrop-filter:blur(8px)}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f3e8d0;font:16px var(--b);padding:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;animation:up 1s .45s both}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;white-space:nowrap}
@media (min-width:760px){.chips{justify-content:center}}
#stage{position:relative;height:calc(var(--bw)*1.5 + 36px);perspective:1300px;margin:10px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.aura{position:absolute;left:50%;top:50%;width:calc(var(--bw)*2.5);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.5;pointer-events:none}
.aura svg{width:100%;height:100%;fill:none;stroke:var(--acc);stroke-width:.45}
.aura .r1{animation:spin 70s linear infinite}.aura .r2{animation:spin 110s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#cf{position:absolute;inset:0;transform-style:preserve-3d}
#cf .bk{position:absolute;left:50%;top:18px;width:var(--bw);margin-left:calc(var(--bw)/-2);animation:none;transform-style:preserve-3d;will-change:transform}
.bk.center .fl{animation:fl2 5s ease-in-out infinite}
@keyframes fl2{50%{transform:translateY(-10px)}}
.bk.center .cv{box-shadow:0 34px 50px -14px hsl(var(--h) 90% 55%/.6),inset 5px 0 8px rgba(0,0,0,.4)}
.cv{container-type:inline-size}
.ti{padding:34% 10% 9%}
.ti small{font-size:4.2cqw;letter-spacing:.2em;margin-bottom:2cqw}
.ti .arb{font-size:16cqw;line-height:1.2;margin-bottom:1.5cqw}
.ti b{font-size:9.4cqw;line-height:1.12}
#info{text-align:center;min-height:200px;margin-top:4px}
#info.sw>*{animation:up .6s both}#info.sw>*:nth-child(2){animation-delay:.06s}#info.sw>*:nth-child(3){animation-delay:.12s}#info.sw>*:nth-child(n+4){animation-delay:.18s}
.pill{display:inline-block;border:1px solid var(--acc);color:var(--acc);border-radius:20px;padding:3px 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}

.pr{display:flex;align-items:center;gap:10px;max-width:250px;margin:0 auto 6px;color:var(--mut);font-size:13px}.pr .pb{flex:1}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go,.gb2{border-radius:40px;padding:12px 22px;font:600 16px var(--b);cursor:pointer;position:relative;overflow:hidden}
.go{border:0;background:linear-gradient(135deg,#ffe29a,#e8b85c 50%,#b9822a);color:#1a1530}
.go::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-120%);animation:sw 3.2s infinite}
@keyframes sw{60%,100%{transform:translateX(120%)}}
.gb2{border:1px solid var(--acc);background:rgba(5,8,28,.5);color:var(--acc)}
#dots{display:flex;gap:7px;justify-content:center;margin:18px 0 6px}

#dots i.on{width:22px;border-radius:7px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.swh{text-align:center;color:var(--mut);font-size:13px;letter-spacing:.3em;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{letter-spacing:.7em;opacity:.5}}
.dua{margin:20px 0 6px}
@media (max-width:720px){.tabs{justify-content:space-around}.tab{padding:8px 8px}.brand{margin-right:2px}}

html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,#3a2a1c 0%,#1b1410 45%,#050403 100%) fixed;color:#f3e8d0;color-scheme:dark}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;right:0;text-align:center;z-index:5;pointer-events:none}
header h1{margin:0;font:600 clamp(20px,5.2vw,36px)/1.1 var(--d);letter-spacing:.14em;text-transform:uppercase;background:none;-webkit-text-fill-color:#d9b46a;color:#d9b46a;animation:none}
header p{margin:6px 0 0;font:italic clamp(13px,2.8vw,17px) var(--b);color:#bfae8f;opacity:.85}

#shelf{position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;transition:transform .2s}
.book{--w:min(46vw,28vh,270px);position:absolute;width:var(--w);left:calc(var(--w)/-2);top:calc(var(--w)*-.75);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;cursor:pointer}
.book .in{position:relative;transform-style:preserve-3d}
.book.center .in{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotateX(2deg)}}
.book.center .cv{box-shadow:0 34px 50px -14px hsl(var(--h) 90% 55%/.5),inset 5px 0 8px rgba(0,0,0,.4)}
.nav{position:absolute;top:46%;z-index:6;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid rgba(217,180,106,.5);background:rgba(20,14,9,.6);color:#d9b46a;font-size:22px;cursor:pointer;backdrop-filter:blur(6px);transition:.25s}
.nav:hover{background:#d9b46a;color:#1b1410}
#prev{left:10px}#next{right:10px}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);text-align:center;z-index:5;pointer-events:none}
.hint .t{font:600 clamp(19px,4.6vw,28px)/1.15 var(--d);color:#d9b46a;padding:0 14px}
.hint .s{font:italic clamp(12px,2.8vw,15px) var(--b);color:#bfae8f;margin:2px 0 12px}
.btns2{pointer-events:auto;display:flex;gap:10px;justify-content:center}
.btns2 button{border:1px solid #d9b46a;background:rgba(20,14,9,.7);color:#d9b46a;border-radius:30px;padding:10px 18px;font:600 15px var(--b);cursor:pointer;transition:.25s}
.btns2 button.primary,.btns2 button:hover{background:#d9b46a;color:#1b1410}
@media (prefers-reduced-motion:reduce){h1 em{animation:none}#rd,#rd.open{transition:none}#sc{scroll-behavior:auto}}
</style>

hat of the Mahdi", ["Explains the Mahdi as both an Islamic belief and a universal human aspiration: a living person, not just an idea, whose existence gives the oppressed concrete hope while he awaits his appointed hour."]], ["Some Objections", ["Lists seven doubts people raise: an impossibly long life, the suspension of natural law, a child’s lack of training, lack of proof of his existence, the delay in appearing, how one man can turn history, and how he could overcome modern power."]], ["Replies I · Longevity and Miracles", ["Argues that a very long life is logically and scientifically conceivable, notes the Qur’an’s 950 years for Nuh, and treats exceptions to natural law as miracles, like Ibrahim in the fire.", "A long life also gives him a vantage over many civilisations."]], ["Replies II · Early Imamate and Evidence", ["Shows earlier Imams also took office as children and were accepted by wide communities.", "Offers hundreds of traditions and the seventy-year minor occultation, with four trusted deputies, as the evidence that he exists."]], ["Replies III · Delay and Method", ["Explains that great revolutions wait for ripe conditions, that an inspired leader can shape history, and that his method can only be outlined in principle until the stage is set."]], ["The Final Victory", ["Gathers Qur’anic verses that promise the lasting success of the righteous and defines ‘expectation of solace’ as dynamic hope rooted in that promise, not wishful thinking."]], ["Philosophy of History", ["Mutahhari contrasts the dialectical-materialist view, in which class conflict drives history, with the human view in which values, free will and moral struggle shape it, and argues the second matches the Qur’an."]], ["An Ideal Society", ["Sketches the hoped-for world: justice, one global government, fair wealth and an end to war.", "It contrasts destructive expectation, which welcomes corruption, with constructive expectation, which works for reform."]]]}, {"t": "Shaykh al-Tusi’s Book of Occultation", "ar": "كتاب الغيبة", "c": "Imam al-Mahdi", "h": 18, "au": "Shaykh al-Tusi", "ch": [["Preface and Biography", ["The translator explains how this work differs from Kamaluddin, then introduces Shaykh al-Tusi, born in 385 AH, from Tus to Baghdad and Najaf, with his teachers, students and many books."]], ["First Principles", ["States the aim of the book: the cause of the occultation, why it is prolonged, what blocks reappearance and what benefit the Imam still gives.", "Builds on the necessity and infallibility of the Imam and the continued presence of truth in the Ummah."]], ["Imam al-Kazim and the Waqifa", ["Reports on Imam Musa al-Kazim’s martyrdom and his clear designation of Imam al-Ridha, followed by a refutation of the Waqifa, who stopped at the seventh Imam."]], ["The Wisdom of Occultation", ["Answers why the Imam is hidden and how a concealed Imam still benefits people, with views of Sayyid Murtadha.", "Precedents include Khidr, Musa, Yusuf, Yunus and the People of the Cave."]], ["Long-Lived Persons", ["Collects stories of long-lived people, Arab and non-Arab, to show that exceptional lifespans are recorded in history."]], ["Twelve Imams and the Reports of Occultation", ["Brings Sunni and Shi’a reports of twelve successors, the Tablet of Fatima and traditions foretelling the occultation and uprising, with the Mahdi from the line of Fatima and Husayn."]], ["Refuting Rival Claims", ["Replies in turn to groups who denied the twelfth Imam: the Kaysaniyya, the Muhammadiyya, those who said Imam al-Askari lived on or had no son, followers of Ja‘far al-Kadhdhab, and believers in thirteen Imams."]], ["Birth, Witnesses and Epistles", ["Evidence of the birth of the Master of the Age, miracles of Imam al-Askari, reports of people who met the Imam, miracles during occultation, and epistles issued by him."]], ["Delay and the Test of the Shi’a", ["Gives reasons for the long delay in reappearance and shows how the occultation tests and refines believers."]], ["The Emissaries", ["Profiles approved and condemned agents of the Imams, the four special deputies, Uthman ibn Sa‘id, Muhammad ibn Uthman, Husayn ibn Rauh and Ali al-Simmari, and false claimants such as al-Hallaj."]], ["Lifespan, Time and Signs", ["Discusses the Imam’s long life, rejects fixing a date for reappearance, reconciles apparently conflicting reports, lists signs preceding it, and closes with his qualities and manners."]]]}, {"t": "Mikyal al-Makarim, Vol. 1", "ar": "مكيال المكارم", "c": "Imam al-Mahdi", "h": 160, "au": "Sayyid Muhammad Taqi Musawi Isfahani", "ch": [["Author’s Preface", ["Ayatullah Isfahani explains why he wrote the book: to show believers that praying for the Imam of the Age is both a duty and a source of blessing, and a way of keeping hearts tied to him through the occultation."]], ["Part 1 · Knowing the Imam", ["Argues that recognising the Imam of one’s time is obligatory, first through rational proof, then through Qur’anic verses and narrations that stress this duty."]], ["Part 2 · Proofs of His Imamate", ["Gathers evidence that Hujjat ibn al-Hasan al-Askari is the promised Mahdi, beginning with widely transmitted traditions about him.", "It then recounts miracles and healings attributed to him, offered as signs of his living presence."]], ["Part 3 · His Rights upon Us", ["Lists six rights the Imam holds over every believer: our very existence, our survival in the world, kinship with the Prophet, the right of a benefactor, of a father over a son, and of a master over those under him."]], ["Part 4 · Why We Must Pray for Him", ["The longest section, arranged by the letters of the Arabic alphabet from Alif to Yaa.", "Under each letter the author gathers the Imam’s titles, qualities and merits, building the case that gratitude and love make praying for him incumbent."]], ["Part 5 · Fruits of the Prayer", ["Over ninety benefits are listed, each tied to narrations: closeness to the Imam, acceptance of prayers, forgiveness of sins, protection from Satan, intercession, ease at death and in the grave, and high ranks in Paradise."]]]}, {"t": "Mikyal al-Makarim, Vol. 2", "ar": "مكيال المكارم", "c": "Imam al-Mahdi", "h": 200, "au": "Sayyid Muhammad Taqi Musawi Isfahani", "ch": [["Part 6 · Daily Times for the Prayer", ["Sets out the moments when praying for the Imam is especially emphasised: after every obligatory prayer, in qunoot and prostration, each morning and evening, and at the close of the day."]], ["Part 6 · Days, Nights and Occasions", ["Covers Thursdays and Fridays, Eid days, Arafah, Ashura, mid-Sha‘ban, Ramadan and its special nights, Ghadir and Muharram.", "It also names moments of grief, hardship and weeping, and the places where such prayers are favoured."]], ["Part 7 · Praying for His Reappearance", ["Explains the special worth of asking God to hasten the Imam’s reappearance, discusses preliminary points, and collects supplications transmitted from the Imams for this purpose."]], ["Part 8 · Duties: Knowing, Loving, Awaiting", ["Opens a long list of duties of believers: learning his qualities, honouring his name, loving him, making him known, awaiting his reappearance eagerly, grieving his separation, and knowing the signs that precede it."]], ["Part 8 · Duties: Giving and Serving", ["Practical devotion on his behalf: charity, Hajj, tawaf and pilgrimage performed for him, helping him with wealth and effort, pleasing believers, and renewing the covenant of allegiance."]], ["Part 8 · Duties: Steadfastness", ["Patience through hardship and denial, prudence with mischief-makers, avoiding fame, self-improvement and unity.", "It warns against fixing a date for the reappearance and against anyone falsely claiming to be his deputy."]], ["Part 8 · Duties: Character and Remembrance", ["Following his moral example, guarding the tongue, weeping for Imam Husayn, visiting his shrine, and living so as to be among those ready to help him when he appears. A bibliography closes the work."]]]}, {"t": "Kamaluddin wa Tamamun Ni’ma, Vol. 1", "ar": "كمال الدين", "c": "Imam al-Mahdi", "h": 145, "au": "Shaykh as-Saduq", "ch": [["Preface and the Author", ["Introduces Shaykh as-Saduq, the great fourth-century scholar, and sets out the book’s aim: to show that the occultation of the twelfth Imam is a foretold truth with precedents among earlier prophets."]], ["Debates and Objections", ["Answers the objections of the Zaydiyya and other doubters, and records the author’s debate with an atheist in the court of Rukn ad-Dawla.", "The argument builds toward one claim: an Imam in occultation will return and fill the earth with justice."]], ["Chapters 1–7 · Occultations of Earlier Prophets", ["Shows that hidden or absent leaders are nothing new, with accounts of Idris, Nuh, Salih, Ibrahim, Yusuf and Musa, then the concealed successors and proofs of God until the time of Isa."]], ["Chapters 8–20 · Those Who Foretold the Prophet", ["A gallery of reports about people who foresaw the Prophet Muhammad’s coming: Isa’s own prophecy, Salman, Quss ibn Sa‘ida, Tubba‘, Bahira the monk, Satih and others.", "They illustrate how expectation prepares a community for a promised guide."]], ["Chapters 21–22 · An Imam in Every Age", ["Argues that the earth is never left without a divine proof, tracing the continuous chain of successors from Adam onward and clarifying words such as ‘itra, ahl and dhurriyya."]], ["Chapters 23–29 · Texts Naming the Qa’im", ["Reports from Allah’s tablet given to the Prophet, from the Prophet himself and from Imam Hasan ibn Ali stating that the Qa’im is the twelfth Imam and that his occultation will occur."]]]}, {"t": "Kamaluddin wa Tamamun Ni’ma, Vol. 2", "ar": "كمال الدين", "c": "Imam al-Mahdi", "h": 135, "au": "Shaykh as-Saduq", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGyASw gAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigD//Z", "ch": [["The Texts on the Qa’im", ["Continues gathering narrations that designate the Qa’im as the twelfth Imam and foretell his occultation, drawn from the Prophet and the Imams."]], ["Hisham ibn Hakam’s Debate", ["Presents the debate of the early scholar Hisham ibn Hakam on the occultation, showing how the need for a concealed Imam was argued in the Imams’ own era."]], ["Khidr and Dhul-Qarnayn", ["Narrations about Khidr and Dhul-Qarnayn, offered as examples of extraordinary lives and hidden presence in earlier history."]], ["Imam al-Askari on His Successor", ["Statements of Imam Hasan al-Askari that point to his son as the next Imam and affirm the textual designation of the Qa’im."]], ["Congratulations and Witnesses", ["Accounts of those who congratulated Imam al-Askari on the birth of his son and of people said to have seen the child, offered as evidence that the Imam was born."]], ["Epistles from the Master of the Age", ["Letters attributed to the twelfth Imam, issued through his deputies during the minor occultation, answering questions of the community."]], ["Supplication in Occultation", ["Includes a supplication for the period of the occultation, a prayer for staying firm in faith while the Imam is hidden."]], ["Bilohar and Yuzasif", ["The book ends with a long moral tale of a prince and his teacher, told as a parable about turning away from worldly attachment."]]]}, {"t": "Hayat al-Qulub, Vol. 1", "ar": "حياة القلوب", "c": "Prophets", "h": 40, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Why Prophets Were Sent", ["Opens with an Imam al-Sadiq conversation: since God is wise and unseen, He must send prophets with proofs and miracles to guide people toward what benefits them."]], ["Adam and Hawwa", ["Their merits, the reasons for their names, their creation, and the events of Paradise and early earthly life, as narrated by the Imams."]], ["Idris and Nuh", ["The account of Idris, then of Nuh’s long mission, the ark and the flood."]], ["Hud and Salih", ["The peoples of ‘Ad and Thamud, the warnings of their prophets, Salih’s she-camel and the destruction that followed rejection."]], ["Ibrahim, Lut and Dhul-Qarnayn", ["Ibrahim’s trials and righteous sons, Lut and his people, and the far-travelling righteous ruler Dhul-Qarnayn."]], ["Ya‘qub, Yusuf, Ayyub and Shu‘ayb", ["Yusuf’s story from jealous brothers and the well to Egypt, Ya‘qub’s grief, Ayyub’s patience, and the mission of Shu‘ayb."]], ["Musa and Harun", ["The longest account, of roughly a hundred pages: Musa’s birth, confrontation with Pharaoh, the Exodus, the covenant and the Israelites’ trials."]], ["Dawud, Sulayman and Luqman", ["Kings and wisdom: Dawud, Talut and Jalut, Sulayman’s dominion and the people of Saba, and Luqman’s counsel to his son."]], ["Zakariyya, Yahya, Maryam and Isa", ["The births of Yahya and Isa, Maryam’s devotion, and a long account of Isa’s miracles and teachings."]], ["Yunus, the Cave and Others", ["Yunus, Jeremiah, Daniel and Uzair, the People of the Cave, the makers of the pit, Khalid ibn Sinan, and unnamed messengers."]], ["Sages, Kings and Harut and Marut", ["Closing pages on pious figures of the Israelites, rulers and kings, and the story of Harut and Marut."]]]}, {"t": "Hayat al-Qulub, Vol. 2", "ar": "حياة القلوب", "c": "Prophet Muhammad", "h": 300, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Ancestry and Early Life", ["Traces the Prophet’s ancestry and the circumstances of his earliest years."]], ["Prophecies, Birth and Appointment", ["Gathers prophecies about him in earlier scriptures and the story of his birth and appointment as a prophet."]], ["Character, Appearance and Miracles", ["A long portrait of his looks, manners and character, followed by the miracles reported of him."]], ["The Prophetic Mission", ["The beginning of open preaching, the opposition in Mecca, and the early struggles of the first Muslims."]], ["From Badr to Uhud", ["Early skirmishes, the Battle of Badr, the incidents between Badr and Uhud, Uhud itself and Hamra al-Asad."]], ["Khandaq and Bani Quraiza", ["The siege known as the Trench, the fate of Bani Quraiza, and the events leading to Hudaybiyyah."]], ["Hudaybiyyah, Khaybar and Mecca", ["The treaty and the pledge of Rizwan, the conquest of Khaybar, letters to rulers, Mutah, Dhat al-Salasil and the conquest of Mecca."]], ["Hunayn, Tabuk and the Mubahala", ["The expedition of Hunayn, the march to Tabuk, and the Mubahala ceremony with the Prophet’s family."]], ["The Farewell Hajj", ["The Prophet’s last pilgrimage, with a description of Hajj and Umra rituals."]], ["Family and Companions", ["The Prophet’s children, wives, relatives and servants, and accounts of senior companions."]], ["Bequests and Passing", ["The excellence of the Ummah, the Prophet’s final bequests, his death, the events that followed it, and the incidents at his tomb."]]]}, {"t": "Hayat al-Qulub, Vol. 3", "ar": "حياة القلوب", "c": "Imamate", "h": 330, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Ch. 1 · An Imam in Every Age", ["Nine parts argue that an Imam is necessary in every era, infallible, designated by explicit text, to be known and obeyed, that guidance comes only through the true Imams, and that the Hadith of the Two Weighty Things and narrations naming all twelve confirm this."]], ["Ch. 2 · The Qur’an and the Ahl al-Bayt", ["Majlisi gathers Qur’anic verses that, in the narrations, point to the Ahl al-Bayt, organised into forty-three parts as a special commentary."]], ["Dhikr, Knowledge and Signs", ["Parts 1–5: ‘Dhikr’ as the Ahl al-Bayt, those with knowledge of the Book, signs and proofs, and their exalted rank."]], ["Love, Trust and Following", ["Parts 6–9: love and devotion to the Ahl al-Bayt, the trust as Imamate, and verses on following them."]], ["The Verse of Light and Witnesses", ["Parts 10–13: a long exegesis of the Verse of Light, the Imams as witnesses over creation, and traditions on faith and believers."]], ["Wilayat in Verse", ["Parts 14–20: the straight path, truth, good deeds and bounty read as Wilayat, plus the Imams as sun, moon and stars and the strong rope."]], ["Titles and Symbols", ["Parts 21–36: words such as ‘Naas’, the ocean of pearls, ‘Nahl’, the seven oft-repeated verses and the consecrated tree, and the Imams as God’s appointed successors."]], ["Grace, Angels and Patience", ["Parts 37–43: justice and the scales, the face and hands of Allah, divine grace, the angels’ regard for the Imams, patience, and verses about the Imams’ afflictions."]]]}, {"t": "Haqq al-Yaqin", "ar": "حق اليقين", "c": "Beliefs", "h": 270, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Summary pending", ["This title is on the shelf, but its source file has not been added yet. Once the book is supplied, its chapter-by-chapter summary will appear here."]]]}];

 for(j=0;j<16;j++)s+='<circle cx="'+r()*200+'" cy="'+r()*150+'" r="'+(r()*1.3+.3)+'" fill="#fff" opacity="'+(r()*.7+.2)+'"/>';
 if(m==0){for(j=0;j<6;j++)s+='<circle cx="100" cy="115" r="'+(20+j*17)+'" fill="none" stroke="hsl('+h+' 85% 72%)" stroke-opacity="'+(.6-j*.09)+'"/>';s+='<circle cx="100" cy="115" r="14" fill="hsl('+h+' 95% 78%)"/>'}
 else if(m==1){for(j=0;j<10;j++){var y=100+j*14;s+='<path d="M0 '+y+'Q50 '+(y-16)+' 100 '+y+'T200 '+y+'" fill="none" stroke="hsl('+(h+j*6)+' 85% 72%)" stroke-opacity="'+(.7-j*.05)+'"/>'}}
 else{for(j=0;j<5;j++){var x=r()*160,w=60+r()*60,t=90+j*14;s+='<path d="M'+(x-w/2)+' 220L'+x+' '+t+'L'+(x+w/2)+' 220Z" fill="hsl('+(h+j*10)+' 60% '+(18+j*7)+'%)" opacity=".85"/>'}s+='<circle cx="150" cy="70" r="16" fill="hsl('+h+' 95% 80%)"/>'}
 return s+'</svg>'}
function mins(b){var n=0;b.ch.forEach(function(c){c[1].forEach(function(p){n+=p.split(' ').length})});return Math.max(1,Math.round(n/180))}
function cover(b,i,k){return '<div class="cv'+(b.img?' im':'')+'" style="--h:'+b.h+'">'+art(b,i,k)+(b.img?'':'<div class="ti"><small>'+b.c+'</small><span class="arb">'+b.ar+'</span><b>'+b.t+'</b></div>')+'</div>'}
var ci=0,els=[],mapB=0;
function prog(i){var a=0,b=0;try{a=+localStorage.getItem('ath:'+i)||0;b=+localStorage.getItem('athb:'+i)||0}catch(e){}return Math.round(Math.max(a,b)*100)}
function build(){var sh=$('#shelf');sh.innerHTML='';els=[];BOOKS.forEach(function(b,i){var d=document.createElement('div');d.className='book';d.style.setProperty('--h',b.h);d.innerHTML='<div class="in">'+cover(b,i,'s')+'</div>';d.onclick=function(){i===ci?open(i,event):go(i)};sh.appendChild(d);els.push(d)})}
function layout(){if(!els.length)return;var w=els[0].offsetWidth||200,g=Math.min(w*1.05,innerWidth*.3);
 els.forEach(function(e,i){var d=i-ci,a=Math.abs(d);e.classList.toggle('center',!d);
  e.style.transform='translateX('+(d*g+(d?Math.sign(d)*g*.3:0))+'px) translateZ('+(-a*140)+'px) rotateY('+(-Math.sign(d)*Math.min(a,1)*42)+'deg) scale('+(d?.9:1.12)+')';
  e.style.opacity=a>3?0:1-a*.18;e.style.filter=d?'brightness('+(.75-a*.1)+') blur('+(a*.6)+'px)':'none';e.style.zIndex=10-a;e.style.pointerEvents=a>3?'none':'auto'});
 var b=BOOKS[ci],p=prog(ci);$('#ht').textContent=b.t;$('#hs').textContent=b.au+(p?' · '+p+'% read':'')}
function go(i){ci=Math.max(0,Math.min(BOOKS.length-1,i));layout()}
function wire(){var st=$('#stage'),sx=null,wl=0;build();
 $('#prev').onclick=function(){go(ci-1)};$('#next').onclick=function(){go(ci+1)};
 $('#bS').onclick=function(e){mode='s';open(ci,e)};$('#bB').onclick=function(e){mode='b';open(ci,e)};
 st.addEventListener('pointerdown',function(e){sx=e.clientX});
 st.addEventListener('pointerup',function(e){if(sx!==null&&Math.abs(e.clientX-sx)>50)go(ci+(e.clientX<sx?1:-1));sx=null});
 st.addEventListener('wheel',function(e){var n=Date.now(),d=e.deltaX||e.deltaY;if(n-wl>350&&Math.abs(d)>10){wl=n;go(ci+(d>0?1:-1))}},{passive:true});
 st.addEventListener('mousemove',function(e){var x=(e.clientX/innerWidth-.5),y=(e.clientY/innerHeight-.5);$('#shelf').style.transform='rotateY('+x*8+'deg) rotateX('+(-y*5)+'deg)'});
 addEventListener('keydown',function(e){if(!rd.classList.contains('open')){if(e.key=='ArrowRight')go(ci+1);if(e.key=='ArrowLeft')go(ci-1);if(e.key=='Enter')open(ci)}});
 addEventListener('resize',layout)}
function listen(){try{if(speechSynthesis.speaking){speechSynthesis.cancel();return}var b=BOOKS[cur],u=new SpeechSynthesisUtterance(b.t+'. '+b.ch.map(function(c){return c[0]+'. '+c[1].join(' ')}).join(' '));u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
/* reader */
var rd=$('#rd'),sc=$('#sc'),io,fs=21,saveT;
function open(i,ev){cur=i;var b=BOOKS[i],h='<header class="hero" style="--h:'+b.h+'">'+cover(b,i,'r')+'<h2>'+b.t+'</h2><p>'+b.c+' · '+mins(b)+' min read · '+b.au+'</p><p style="margin-top:12px;font-size:14px;color:var(--rm)">A chapter-by-chapter summary written for this library, not the book’s own text.</p></header>';
 b.ch.forEach(function(c,n){h+='<div class="chn"><i>'+(n+1)+'</i><h3>'+c[0]+'</h3></div>';c[1].forEach(function(p,k){h+='<p'+(k?'':' class="f"')+'>'+p+'</p>'})});
 var nx=(i+1)%BOOKS.length;h+='<div class="fin"><h3>— Fin —</h3><button class="nx" id="nx">Next: '+BOOKS[nx].t+' →</button></div>';
 $('#tx').innerHTML=h;$('#rt').textContent=b.t;$('#nx').onclick=function(e){open(nx,e);sc.scrollTop=0};
 rd.style.setProperty('--ox',(ev&&ev.clientX||innerWidth/2)+'px');rd.style.setProperty('--oy',(ev&&ev.clientY||innerHeight/2)+'px');
 rd.classList.add('open');buildBook(b,i);setMode(mode);sc.style.scrollBehavior='auto';sc.scrollTop=0;sc.style.scrollBehavior='';
 if(io)io.disconnect();io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add('in')})},{root:sc,threshold:.15});
 document.querySelectorAll('#tx p').forEach(function(p){io.observe(p)});
 var sv=0;try{sv=+localStorage.getItem('ath:'+i)||0}catch(e){}
 var rs=$('#res');rs.classList.remove('show');if(sv>.05&&sv<.97){rs.textContent='Resume where you left off · '+Math.round(sv*100)+'%';rs.onclick=function(){sc.scrollTop=sv*(sc.scrollHeight-sc.clientHeight);rs.classList.remove('show')};setTimeout(function(){rs.classList.add('show')},1100);setTimeout(function(){rs.classList.remove('show')},7000)}}
sc.onscroll=function(){var m=sc.scrollHeight-sc.clientHeight,p=m>0?sc.scrollTop/m:0;$('#bar i').style.width=p*100+'%';clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem('ath:'+cur,p)}catch(e){}},400)};
function close(){rd.classList.remove('open');try{speechSynthesis.cancel()}catch(e){}layout()}
var mode='b',BL=0,bp=0,busy=0,leaves=[],snd=0,ac,mapB=0;
try{mode=localStorage.getItem('ath:mode')||'b'}catch(e){}
function sfx(){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var n=ac.sampleRate*.5|0,bf=ac.createBuffer(1,n,ac.sampleRate),d=bf.getChannelData(0),i;for(i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)*(i<n*.15?i/(n*.15):1);var s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=2400;f.Q.value=.6;g.gain.value=.35;s.buffer=bf;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
function pa(h,n){return `<div class='fc pa'>${h}${n?`<div class='nm'>${n}</div>`:''}</div>`}
var R=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function bf(b,i){var F=[],pn=0,lc=`<div class='fc lc b' style='--h:${b.h}'><div class='mb'></div></div>`,st=1;
 F.push(b.img?`<div class='fc lc im' style='--h:${b.h}'><img class='fi' src='${b.img}'></div>`:`<div class='fc lc' style='--h:${b.h}'><div class='med'>${art(b,i,'k')}</div><div class='lt'><small>${b.c}</small><span class='arb'>${b.ar}</span><b>${b.t}</b></div></div>`,lc);
 F.push(pa(`<div class='ctr'><div class='dia'></div><h4>${b.t}</h4><i>${b.au}</i><i>Summary edition</i><div class='dia'></div></div>`));
 F.push(pa('<h4>Contents</h4>'+b.ch.map(function(c,n){var h=`<div class='ln'><span>${c[0]}</span><u></u><em>${st}</em></div>`;st+=c[1].length;return h}).join('')));
 b.ch.forEach(function(c,n){F.push(pa(`<div class='ctr'><div class='kk'>Chapter</div><div class='bg'>${R[n%12]}</div><h4>${c[0]}</h4><div class='dia'></div></div>`));
  c[1].forEach(function(p,k){F.push(pa(`<div class='rt'>${c[0]}</div><p${k?'':" class='f'"}>${p}</p>`,++pn))})});
 if(F.length%2)F.push(pa(`<div class='ctr'><div class='dia'></div></div>`));
 F.push(pa(`<div class='ctr'><div class='dia'></div><h4>Finis</h4><i>End of the summary of \u201c${b.t}\u201d.</i><button class='nx' id='nb'>Next book \u2192</button></div>`),lc);
 return F.map(function(x,k){return k%2&&x.indexOf('fc pa')>-1?x.replace('fc pa','fc pa b'):x})}
function buildBook(b,i){var F=bf(b,i),bo=$('#bo');BL=F.length/2;bp=0;leaves=[];bo.innerHTML="<div class='sp'></div>";
 for(var k=0;k<BL;k++){var d=document.createElement('div');d.className='lf';d.style.zIndex=BL-k;d.innerHTML=F[2*k]+F[2*k+1];(function(k){d.onclick=function(){if(k==bp)flip(1);else if(k==bp-1)flip(-1)}})(k);bo.appendChild(d);leaves.push(d)}
 var nb=$('#nb');if(nb)nb.onclick=function(e){e.stopPropagation();open((i+1)%BOOKS.length,e)}}
function bplace(){var pw=$('#scn').offsetWidth/2;$('#bo').style.transform='translateX('+(bp==0?-pw/2:bp==BL?pw/2:0)+'px) rotateX('+(bp>0&&bp<BL?5:0)+'deg)';$('#pv').disabled=!bp;$('#nt').disabled=bp==BL;$('#bi').textContent=bp==0?'Cover':bp==BL?'Back cover':'Spread '+bp+' of '+(BL-1);if(mode=='b'){$('#bar i').style.width=bp/BL*100+'%';if(bp)try{localStorage.setItem('athb:'+cur,bp/BL)}catch(e){}}}
function flip(d){if(busy)return;var k=d>0?bp:bp-1;if(k<0||k>=BL)return;busy=1;var l=leaves[k];l.style.zIndex=99;l.classList.add('tn');l.classList.toggle('f',d>0);bp+=d;bplace();sfx();setTimeout(function(){l.style.zIndex=d>0?k:BL-k},650);setTimeout(function(){l.classList.remove('tn');busy=0},1300)}
function setMode(m){mode=m;try{localStorage.setItem('ath:mode',m)}catch(e){}rd.classList.toggle('bm',m=='b');$('#md').textContent=m=='b'?'📜':'📖';
 if(m=='b'){var o=$('#bo');o.style.transition='none';bplace();void o.offsetWidth;o.style.transition='';if(bp==0)setTimeout(function(){if(mode=='b'&&bp==0)flip(1)},1200)}else sc.onscroll()}
$('#md').onclick=function(){setMode(mode=='b'?'s':'b')};
$('#cn').onclick=function(){rd.classList.toggle('cn')};
$('#sn').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇';sfx()};
$('#nt').onclick=function(){flip(1)};$('#pv').onclick=function(){flip(-1)};
var tx0=null;$('#bkv').addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
$('#bkv').addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx0;if(tx0!==null&&Math.abs(d)>40)flip(d<0?1:-1);tx0=null});
addEventListener('resize',function(){if(mode=='b')bplace()});
/* constellations */
var TG=[["history", "hope"], ["proof", "signs"], ["dua", "rights"], ["dua", "duties"], ["prophets", "proof"], ["proof", "epistles"], ["prophets", "history"], ["history", "prophet"], ["proof", "prophet"], ["beliefs", "proof"]];
function buildMap(){var n=BOOKS.length,P=[],E='',N='',i,j;
 BOOKS.forEach(function(b,i){var a=i*6.2832/n-1.5708;P[i]=[50+36*Math.cos(a),50+33*Math.sin(a)]});
 for(i=0;i<n;i++)for(j=i+1;j<n;j++){var sh=TG[i].filter(function(t){return TG[j].indexOf(t)>-1});if(sh.length)E+=`<line data-a='${i}' data-b='${j}' data-t='${sh[0]}' x1='${P[i][0]}' y1='${P[i][1]}' x2='${P[j][0]}' y2='${P[j][1]}'/>`}
 BOOKS.forEach(function(b,i){N+=`<button class='nd' data-i='${i}' style='left:${P[i][0]}%;top:${P[i][1]}%;--h:${b.h};--n:${i}'><span class='o'>${art(b,i,'m')}</span><span class='tt'>${b.t}</span></button>`});
 $('#map').innerHTML=`<svg class='ln' viewBox='0 0 100 100' preserveAspectRatio='none'>${E}</svg>${N}<div id='cap'>Hover or tap a book to see its threads · tap again to read</div>`;
 document.querySelectorAll('.nd').forEach(function(e){var k=+e.dataset.i,cp=$('#cap');
  e.onpointerenter=function(){var t=[];document.querySelectorAll('#map line').forEach(function(l){var on=l.dataset.a==k||l.dataset.b==k;l.classList.toggle('hi',on);if(on)t.push('“'+l.dataset.t+'” with '+BOOKS[l.dataset.a==k?l.dataset.b:l.dataset.a].t)});cp.textContent=t.join(' · ')};
  e.onpointerleave=function(){document.querySelectorAll('#map line').forEach(function(l){l.classList.remove('hi')})};
  e.onclick=function(ev){open(k,ev)}})}

$('#x').onclick=close;
$('#fm').onclick=function(){fs=Math.max(16,fs-2);$('#tx').style.setProperty('--fs',fs+'px')};
$('#fp').onclick=function(){fs=Math.min(32,fs+2);$('#tx').style.setProperty('--fs',fs+'px')};
$('#th').onclick=function(){rd.classList.toggle('paper')};
addEventListener('keydown',function(e){if(e.key=='Escape')close();if(rd.classList.contains('open')&&mode=='b'){if(e.key=='ArrowRight')flip(1);if(e.key=='ArrowLeft')flip(-1)}});
$("#ls").onclick=listen;wire();layout();setTimeout(layout,300);
</script>
</body>
