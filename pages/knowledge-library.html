 F.push(pa(`<div class='ctr'><div class='dia'></div><h4>${b.t}</h4><i>${b.au}</i><i>Detailed summary edition</i><div class='dia'></div></div>`));
 var P=b.ch.map(pages),it=b.ch.map(function(c,n){var h=`<div class='ln' onclick='event.stopPropagation();goCh(${n})'><span>${c[0]}</span><u></u><em>${st}</em></div>`;st+=P[n].length;return h});
 for(var q=0;q<it.length;q+=6)F.push(pa('<h4>Contents</h4>'+it.slice(q,q+6).join('')));
 CHF=[];
 b.ch.forEach(function(c,n){CHF.push(F.length);F.push(pa(`<div class='ctr'><div class='kk'>Chapter</div><div class='bg'>${R[n%12]}</div><h4>${c[0]}</h4><div class='dia'></div>${pdfBtn(b,n)}</div>`));
  P[n].forEach(function(x){F.push(pa(`<div class='rt'>${c[0]}</div>${x.h?`<h5 class='sb2'>${x.h}</h5>`:''}<p${x.f?" class='f'":''}>${x.t}</p>`,++pn))})});
 if(F.length%2)F.push(pa(`<div class='ctr'><div class='dia'></div></div>`));
 F.push(pa(`<div class='ctr'><div class='dia'></div><h4>Finis</h4><i>End of the summary of \u201c${b.t}\u201d.</i><button class='nx' id='nb'>Next book \u2192</button></div>`),lc);
 return F.map(function(x,k){return k%2&&x.indexOf('fc pa')>-1?x.replace('fc pa','fc pa b'):x})}
function buildBook(b,i){var F=bf(b,i),bo=$('#bo');BL=F.length/2;bp=0;leaves=[];bo.innerHTML="<div class='sp'></div>";
 for(var k=0;k<BL;k++){var d=document.createElement('div');d.className='lf';d.style.zIndex=BL-k;d.innerHTML=F[2*k]+F[2*k+1];(function(k){d.onclick=function(){if(k==bp)flip(1);else if(k==bp-1)flip(-1)}})(k);bo.appendChild(d);leaves.push(d)}
 var nb=$('#nb');if(nb)nb.onclick=function(e){e.stopPropagation();open((i+1)%BOOKS.length,e)}}
function bplace(){var pw=$('#scn').offsetWidth/2;$('#bo').style.transform='translateX('+(bp==0?-pw/2:bp==BL?pw/2:0)+'px) rotateX('+(bp>0&&bp<BL?5:0)+'deg)';$('#pv').disabled=!bp;$('#nt').disabled=bp==BL;$('#bi').textContent=bp==0?'Cover':bp==BL?'Back cover':'Spread '+bp+' of '+(BL-1);if(mode=='b'){$('#bar i').style.width=bp/BL*100+'%';if(bp)try{localStorage.setItem('athb:'+cur,bp/BL)}catch(e){}}}
function flip(d){if(busy)return;var k=d>0?bp:bp-1;if(k<0||k>=BL)return;busy=1;var l=leaves[k];l.style.zIndex=99;l.classList.add('tn');l.classList.toggle('f',d>0);bp+=d;bplace();sfx();setTimeout(function(){l.style.zIndex=d>0?k:BL-k},650);setTimeout(function(){l.classList.remove('tn');busy=0},1300)}
function goCh(n){var fi=CHF[n];if(fi==null||busy)return;var t=fi%2?(fi+1)/2:fi/2;flipTo(t)}
function flipTo(t){if(busy||t==bp)return;var f=t>bp,st=Math.abs(t-bp),dl=Math.max(80,Math.min(240,1800/st)),du=st>1?.55:1.3,bo=$('#bo'),ks=[],k;
 if(f)for(k=bp;k<t;k++)ks.push(k);else for(k=bp-1;k>=t;k--)ks.push(k);
 busy=1;bo.style.setProperty('--ft',du+'s');bp=t;bplace();
 ks.forEach(function(k,i){setTimeout(function(){var l=leaves[k];l.style.zIndex=100+(f?k:BL-k);l.classList.add('tn');l.classList.toggle('f',f);sfx();setTimeout(function(){l.style.zIndex=f?k:BL-k},du*500);setTimeout(function(){l.classList.remove('tn')},du*1000)},i*dl)});
 setTimeout(function(){busy=0;bo.style.removeProperty('--ft')},(ks.length-1)*dl+du*1000+80)}
function setMode(m){mode=m;try{localStorage.setItem('ath:mode',m)}catch(e){}rd.classList.toggle('bm',m=='b');$('#md').textContent=m=='b'?'📜':'📖';
 if(m=='b'){var o=$('#bo');o.style.transition='none';bplace();void o.offsetWidth;o.style.transition='';if(bp==0)setTimeout(function(){if(mode=='b'&&bp==0)flip(1)},1200)}else sc.onscroll()}
$('#md').onclick=function(){setMode(mode=='b'?'s':'b')};
$('#cn').onclick=function(){rd.classList.toggle('cn')};
$('#sn').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇';sfx()};
$('#nt').onclick=function(){flip(1)};$('#pv').onclick=function(){flip(-1)};
var tx0=null;$('#bkv').addEventListener('touchstart',function(e){tx0=e.touches[0].clientX},{passive:true});
$('#bkv').addEventListener('touchend',function(e){var d=e.changedTouches[0].clientX-tx0;if(tx0!==null&&Math.abs(d)>40)flip(d<0?1:-1);tx0=null});
addEventListener('resize',function(){if(mode=='b')bplace()});
/* constellations */
var TG=[["history", "hope"], ["proof", "signs"], ["dua", "rights"], ["dua", "duties"], ["prophets", "proof"], ["proof", "epistles"], ["prophets", "history"], ["history", "prophet"], ["proof", "prophet"], ["beliefs", "proof"]];
function buildMap(){var n=BOOKS.length,P=[],E='',N='',i,j;
 BOOKS.forEach(function(b,i){var a=i*6.2832/n-1.5708;P[i]=[50+36*Math.cos(a),50+33*Math.sin(a)]});
 for(i=0;i<n;i++)for(j=i+1;j<n;j++){var sh=TG[i].filter(function(t){return TG[j].indexOf(t)>-1});if(sh.length)E+=`<line data-a='${i}' data-b='${j}' data-t='${sh[0]}' x1='${P[i][0]}' y1='${P[i][1]}' x2='${P[j][0]}' y2='${P[j][1]}'/>`}
 BOOKS.forEach(function(b,i){N+=`<button class='nd' data-i='${i}' style='left:${P[i][0]}%;top:${P[i][1]}%;--h:${b.h};--n:${i}'><span class='o'>${art(b,i,'m')}</span><span class='tt'>${b.t}</span></button>`});
 $('#map').innerHTML=`<svg class='ln' viewBox='0 0 100 100' preserveAspectRatio='none'>${E}</svg>${N}<div id='cap'>Hover or tap a book to see its threads · tap again to read</div>`;
 document.querySelectorAll('.nd').forEach(function(e){var k=+e.dataset.i,cp=$('#cap');
  e.onpointerenter=function(){var t=[];document.querySelectorAll('#map line').forEach(function(l){var on=l.dataset.a==k||l.dataset.b==k;l.classList.toggle('hi',on);if(on)t.push('“'+l.dataset.t+'” with '+BOOKS[l.dataset.a==k?l.dataset.b:l.dataset.a].t)});cp.textContent=t.join(' · ')};
  e.onpointerleave=function(){document.querySelectorAll('#map line').forEach(function(l){l.classList.remove('hi')})};
  e.onclick=function(ev){open(k,ev)}})}

$('#x').onclick=close;
$('#fm').onclick=function(){fs=Math.max(16,fs-2);$('#tx').style.setProperty('--fs',fs+'px')};
$('#fp').onclick=function(){fs=Math.min(32,fs+2);$('#tx').style.setProperty('--fs',fs+'px')};
$('#th').onclick=function(){rd.classList.toggle('paper')};
addEventListener('keydown',function(e){if(e.key=='Escape')close();if(rd.classList.contains('open')&&mode=='b'){if(e.key=='ArrowRight')flip(1);if(e.key=='ArrowLeft')flip(-1)}});
$("#ls").onclick=listen;wire();layout();setTimeout(layout,300);
</script>
