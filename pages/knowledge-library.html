<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Muntazir Athenaeum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IM+Fell+English:ital@0;1&family=Cinzel+Decorative:wght@700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
:root{--bg1:#0f1a4b;--bg2:#040614;--ink:#efe9ff;--mut:#a09fcb;--star:255,255,255;--acc:#e8b85c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);
--d:'Fraunces',Georgia,serif;--ar:'Aref Ruqaa','Amiri',serif;--b:'Newsreader',Georgia,serif;color-scheme:dark;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#f6eedc;--bg2:#dccfb2;--ink:#2a2233;--mut:#6d6280;--star:90,70,120;--acc:#a8641a;--card:rgba(255,255,255,.55);--line:rgba(42,34,51,.18);color-scheme:light}}
:root[data-theme="dark"]{--bg1:#0f1a4b;--bg2:#040614;--ink:#efe9ff;--mut:#a09fcb;--star:255,255,255;--acc:#e8b85c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg1),var(--bg2) 75%) fixed;color:var(--ink);font-family:var(--b);overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:7vh 20px 80px}
.eye{letter-spacing:.4em;text-transform:uppercase;font-size:12px;color:var(--acc);text-align:center}
h1{font:300 clamp(40px,10vw,92px)/1 var(--d);text-align:center;margin:.2em 0 .15em;letter-spacing:-.02em}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--acc),#ff8fb1,#8fd3ff,var(--acc));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.sub{text-align:center;color:var(--mut);font-size:clamp(16px,3.6vw,21px);font-style:italic;max-width:560px;margin:0 auto 28px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:44px}
.chip,.srch,.surp{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:40px;padding:9px 18px;font:15px var(--b);cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.chip:hover,.surp:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:#1a1530;border-color:var(--acc)}
.srch{cursor:text;outline:none;width:170px}
.surp{font-style:italic;color:var(--acc)}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:34px 22px}
.bk{cursor:pointer;opacity:0;transform:translateY(30px);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--n)*90ms)}
@keyframes rise{to{opacity:1;transform:none}}
.cv{position:relative;aspect-ratio:2/3;border-radius:3px 9px 9px 3px;overflow:hidden;transform:perspective(700px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .25s,box-shadow .3s;
box-shadow:0 18px 30px -12px rgba(0,0,0,.65),inset 5px 0 8px rgba(0,0,0,.4)}
.bk:hover .cv{box-shadow:0 30px 50px -14px hsl(var(--h) 90% 55%/.55),inset 5px 0 8px rgba(0,0,0,.4)}
.cv svg{position:absolute;inset:0;width:100%;height:100%}
.cv::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 55%);opacity:0;transition:.3s;mix-blend-mode:overlay}
.bk:hover .cv::after{opacity:1}
.ti{position:absolute;left:0;right:0;bottom:0;padding:34% 12% 11%;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff6e0}
.ti small{display:block;letter-spacing:.3em;text-transform:uppercase;font-size:9px;opacity:.8;margin-bottom:5px}
.ti b{font:600 clamp(15px,3.6vw,19px)/1.12 var(--d)}
.meta{margin-top:12px;color:var(--mut);font-size:14px;text-align:center;font-style:italic}
.meta s{text-decoration:none;color:var(--acc)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);font-style:italic}
/* reader */
#rd{--rbg:#0c0e24;--rink:#e9e4f7;--rm:#9a97c4;position:fixed;inset:0;z-index:10;background:var(--rbg);color:var(--rink);clip-path:circle(0 at 50% 50%);visibility:hidden;transition:clip-path .9s cubic-bezier(.7,0,.2,1),visibility 0s .9s}
#rd.open{clip-path:circle(160% at var(--ox) var(--oy));visibility:visible;transition:clip-path 1s cubic-bezier(.6,0,.2,1),visibility 0s}
#rd.paper{--rbg:#f4ead3;--rink:#2c2418;--rm:#7a6a4e}
#bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:3;background:rgba(128,128,128,.2)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb1,var(--acc))}
.rh{position:absolute;top:3px;left:0;right:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:linear-gradient(var(--rbg) 60%,transparent)}
.rh span{flex:1;text-align:center;font:italic 15px var(--d);color:var(--rm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh button{border:1px solid currentColor;background:none;color:var(--rm);border-radius:30px;min-width:40px;height:38px;padding:0 12px;font:16px var(--b);cursor:pointer;opacity:.85}
.rh button:hover{color:var(--acc);opacity:1}
#sc{position:absolute;inset:0;overflow-y:auto;scroll-behavior:smooth;padding:calc(env(safe-area-inset-top,0px) + 70px) 22px calc(env(safe-area-inset-bottom,0px) + 90px)}
#tx{--fs:21px;max-width:660px;margin:0 auto;font-size:var(--fs);line-height:1.75}
.hero{text-align:center;margin-bottom:70px}
.hero .cv{width:150px;margin:0 auto 26px}
.hero h2{font:300 clamp(34px,8vw,56px)/1.05 var(--d);margin:0 0 8px}
.hero p{color:var(--rm);font-style:italic;margin:0}
.chn{text-align:center;margin:90px 0 36px}
.chn i{display:block;font:300 80px/1 var(--d);color:var(--acc);opacity:.9}
.chn h3{font:600 28px var(--d);margin:6px 0 0}
.chn::after{content:"❦";display:block;color:var(--rm);margin-top:14px}
#tx p{margin:0 0 1.2em;opacity:0;transform:translateY(18px);transition:.9s cubic-bezier(.2,.8,.2,1)}
#tx p.in{opacity:1;transform:none}
#tx p.f::first-letter{float:left;font:600 3.5em/.8 var(--d);color:var(--acc);padding:.06em .1em 0 0}
.fin{text-align:center;margin:90px 0 30px}
.fin h3{font:italic 300 34px var(--d);margin:0 0 20px}
.nx{border:1px solid var(--acc);background:none;color:var(--acc);border-radius:40px;padding:12px 26px;font:italic 18px var(--b);cursor:pointer;transition:.25s}
.nx:hover{background:var(--acc);color:#1a1530}
#res{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translate(-50%,120px);z-index:3;background:var(--acc);color:#1a1530;border:0;border-radius:40px;padding:11px 22px;font:italic 16px var(--b);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,.9,.3,1.3)}
#res.show{transform:translate(-50%,0)}
.views{display:flex;gap:10px;justify-content:center;margin:0 0 18px}
.vw{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:40px;padding:9px 20px;font:15px var(--b);cursor:pointer;backdrop-filter:blur(8px);transition:.25s}
.vw.on{background:var(--acc);color:#1a1530;border-color:var(--acc)}
#map{display:none;position:relative;height:min(78vh,640px);margin-top:10px}
#map.on{display:block}
#map svg.ln{position:absolute;inset:0;width:100%;height:100%}
#map line{stroke:rgba(var(--star),.3);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:4 6;animation:dash 20s linear infinite;transition:.3s}
#map line.hi{stroke:var(--acc);stroke-width:2.4}
@keyframes dash{to{stroke-dashoffset:-200}}
.nd{position:absolute;transform:translate(-50%,-50%);width:clamp(62px,13vw,96px);cursor:pointer;text-align:center;background:none;border:0;color:var(--ink);font:13px/1.2 var(--b);padding:0}
.nd .o{display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px hsl(var(--h) 80% 70%/.8),0 0 30px hsl(var(--h) 90% 60%/.6);animation:pulse 4s ease-in-out infinite;animation-delay:calc(var(--n)*-.7s);transition:transform .3s}
.nd:hover .o{transform:scale(1.18)}
.nd .o svg{width:100%;height:100%;display:block}
.nd .tt{display:block;margin-top:6px}
@keyframes pulse{50%{box-shadow:0 0 0 2px hsl(var(--h) 80% 70%/.8),0 0 48px hsl(var(--h) 95% 65%/.9)}}
#cap{position:absolute;left:0;right:0;bottom:0;text-align:center;color:var(--mut);font-style:italic;min-height:1.5em;font-size:15px}
#bkv{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#3a2614,#120a05 85%)}
#rd.bm{--rbg:#120a05;--rm:#c9a56b}
#rd.bm #bkv{display:flex}#rd.bm #sc,#rd.bm #fm,#rd.bm #fp,#rd.bm #th{display:none}#rd.bm .rh{background:none}
#scn{--pw:min(45vw,50vh,380px);perspective:2600px;width:calc(var(--pw)*2);height:calc(var(--pw)*1.42);position:relative;margin-bottom:30px}
#bo{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.25,1);filter:drop-shadow(0 30px 36px rgba(0,0,0,.8))}
.lf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform var(--ft,1.3s) cubic-bezier(.5,.05,.2,1)}
.lf.f{transform:rotateY(-180deg)}
.fc{--gd:90deg;position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fc.b{transform:rotateY(180deg);--gd:270deg}
.fc::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(var(--gd),rgba(30,15,0,.65),transparent 70%)}
.lf.tn .fc::after{animation:shd var(--ft,1.3s) ease-in-out}
@keyframes shd{0%,100%{opacity:0}50%{opacity:.85}}
.fc.pa{padding:12% 11%;color:#3b2a14;font-family:'IM Fell English',Georgia,serif;border-radius:2px 5px 5px 2px;background:radial-gradient(ellipse at 30% 15%,rgba(255,255,255,.4),transparent 55%),radial-gradient(circle at 88% 92%,rgba(120,70,20,.4),transparent 40%),radial-gradient(circle at 8% 70%,rgba(120,80,30,.22),transparent 30%),linear-gradient(var(--gd),#c4a064,#e4cb94 9%,#ebd8a8 92%,#d2b278);box-shadow:inset 0 0 40px rgba(110,70,20,.5)}
.fc.pa.b{border-radius:5px 2px 2px 5px}
.fc.pa::before{content:'';position:absolute;inset:5%;border:1px solid rgba(110,60,20,.5);box-shadow:0 0 0 3px rgba(110,60,20,.12);pointer-events:none}
.pa h4{font:700 calc(var(--pw)*.07)/1.15 'Cinzel Decorative',serif;text-align:center;margin:.5em 0;color:#4a2a0c}
.pa p{font-size:calc(var(--pw)*.058);line-height:1.5;text-align:justify;margin:.45em 0}
.pa p.f::first-letter{float:left;font:700 3.3em/.8 'Cinzel Decorative',serif;color:#9b1c1c;padding:.06em .08em 0 0}
.pa .ctr{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.3em}
.pa .kk{letter-spacing:.35em;text-transform:uppercase;font-size:calc(var(--pw)*.04);color:#7a5a2a}
.pa .bg{font:700 calc(var(--pw)*.26)/1 'Cinzel Decorative',serif;color:#9b1c1c}
.pa .dia{width:calc(var(--pw)*.07);aspect-ratio:1;border:1.5px solid #9b1c1c;transform:rotate(45deg);margin:.7em 0}
.pa i{font-size:calc(var(--pw)*.05)}
.pa .nm{position:absolute;bottom:7%;left:0;right:0;text-align:center;font-size:calc(var(--pw)*.045);color:#7a5a2a}
.pa .ln{display:flex;gap:6px;align-items:baseline;margin:.8em 0;font-size:calc(var(--pw)*.052)}
.pa .ln u{flex:1;order:1;border-bottom:1px dotted #7a5a2a;text-decoration:none}.pa .ln em{order:2}
.fc.lc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7%;text-align:center;border-radius:3px 9px 9px 3px;background:repeating-linear-gradient(37deg,rgba(0,0,0,.1) 0 1px,transparent 1px 3px),radial-gradient(circle at 30% 25%,hsl(var(--h) 40% 30%),hsl(var(--h) 45% 11%));box-shadow:inset 0 0 50px rgba(0,0,0,.7)}
.fc.lc.b{border-radius:9px 3px 3px 9px}
.fc.lc::before{content:'';position:absolute;inset:5%;border:2px solid #d8b25a;box-shadow:inset 0 0 0 5px rgba(0,0,0,.25),inset 0 0 0 6px #d8b25a99}
.med{width:50%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid #d8b25a;box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 0 6px #d8b25a}
.med svg{width:100%;height:100%;display:block}
.lt{padding:0 12%}.lt small{letter-spacing:.3em;font-size:calc(var(--pw)*.035);color:#d8b25a;text-transform:uppercase}
.lt b{display:block;font:700 calc(var(--pw)*.085)/1.15 'Cinzel Decorative',serif;background:linear-gradient(#fff0b3,#c9962d,#f5d98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.mb{position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 40%,hsl(var(--h) 60% 35%) 0 6px,hsl(calc(var(--h) + 30) 50% 55%) 6px 12px,#e8d3a0 12px 15px);opacity:.9}
.sp{position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(0,0,0,.3);box-shadow:0 0 18px 6px rgba(0,0,0,.25);pointer-events:none}
.bn{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;gap:14px;justify-content:center;align-items:center;color:#c9a56b;font-style:italic}
.bn button{border:1px solid #c9a56b;background:rgba(20,10,0,.6);color:#e8c98a;border-radius:30px;padding:9px 20px;font:16px var(--b);cursor:pointer}
.bn button:disabled{opacity:.3}
#bi{min-width:110px;text-align:center}
#rd.cn::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(circle at 50% 45%,rgba(255,190,90,.16),rgba(0,0,0,.78) 78%);animation:fl 3.1s infinite}
@keyframes fl{0%,100%{opacity:.9}20%{opacity:1}45%{opacity:.78}70%{opacity:.96}}
@media (max-width:520px){.rh span{display:none}.rh{justify-content:flex-end}.rh #x{margin-right:auto}}

.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ti .arb{display:block;font:400 clamp(20px,5vw,26px)/1.25 var(--ar);color:#ffe9b0;margin-bottom:3px}
.lt .arb{display:block;font:400 calc(var(--pw)*.1)/1.2 var(--ar);color:#ffe9b0;margin:.2em 0}
.fi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc.lc.im::before{display:none}
.pa p{font-size:calc(var(--pw)*.052);line-height:1.42}
.pa .rt{font:italic calc(var(--pw)*.045)/1.2 'IM Fell English',serif;text-align:center;color:#7a5a2a;margin:0 0 .7em;padding-bottom:.4em;border-bottom:1px solid rgba(110,60,20,.3)}
.pa h4{font-size:calc(var(--pw)*.058)}

main{max-width:1240px;padding-top:84px}
main>section{display:none}main>section.on{display:block}
#top{position:fixed;top:0;left:0;right:0;z-index:6;height:60px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(rgba(5,8,28,.95),rgba(5,8,28,.7));border-bottom:1px solid rgba(232,184,92,.35);backdrop-filter:blur(10px)}
.brand{font:700 15px var(--d);letter-spacing:.14em;color:#e8b85c;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;justify-content:center;scrollbar-width:none}
.tab{background:none;border:1px solid transparent;color:#eadfc4;padding:8px 14px;border-radius:10px;font:15px var(--b);cursor:pointer;white-space:nowrap;transition:.25s}
.tab:hover{color:#e8b85c}.tab.on{border-color:#e8b85c;color:#e8b85c;background:rgba(232,184,92,.1)}
.ic{background:rgba(255,255,255,.08);border:1px solid rgba(232,184,92,.4);color:#e8b85c;width:40px;height:34px;border-radius:20px;font-size:17px;cursor:pointer}
.decor{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .6s}
.moon{position:absolute;right:7vw;top:90px;width:clamp(34px,5vw,62px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfe0ff 60%,#8aa6d8);box-shadow:0 0 40px 10px rgba(170,200,255,.45)}
.shl{position:absolute;left:0;top:64px;width:min(15vw,220px);height:56vh;opacity:.5;background:repeating-linear-gradient(90deg,#3b2414 0 10px,#1d1008 10px 12px,#52341c 12px 22px,#241409 22px 24px,#6b4423 24px 29px,#2c1a0d 29px 31px);-webkit-mask-image:linear-gradient(90deg,#000 35%,transparent);mask-image:linear-gradient(90deg,#000 35%,transparent)}
.cty{position:absolute;right:0;bottom:12vh;width:min(34vw,420px);opacity:.85}
.cur{position:absolute;right:0;top:0;bottom:0;width:7vw;background:linear-gradient(270deg,rgba(14,22,90,.85),transparent)}
.lan{position:absolute;bottom:4vh;width:40px;height:62px;border-radius:12px 12px 6px 6px;background:radial-gradient(circle at 50% 55%,#ffe7a3,#d28a1c 60%,#5b3508);box-shadow:0 0 60px 24px rgba(255,170,60,.4);animation:fl 3.2s infinite}
.l1{left:3vw}.l2{right:4vw;bottom:6vh}
:root[data-theme="light"] .decor{opacity:.12}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .decor{opacity:.12}}
.eye{letter-spacing:.45em;text-transform:uppercase;font-size:13px;color:var(--ink);text-align:center}
h1{font:italic 600 clamp(38px,8.5vw,84px)/1.05 var(--d);background:linear-gradient(180deg,#ffe6a8,#e8b85c 55%,#b9822a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:.1em 0}
.sub{font-size:clamp(15px,3vw,19px)}
.sh{font:italic 600 clamp(30px,6vw,46px) var(--d);text-align:center;color:var(--acc);margin:10px 0}
.srow{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px auto 10px;max-width:980px}
.sbox{flex:1 1 280px;display:flex;align-items:center;gap:10px;border:1px solid var(--acc);border-radius:40px;padding:0 18px;background:rgba(5,8,28,.55);color:var(--acc);font-size:20px}
.sbox input{flex:1;background:none;border:0;outline:0;color:#f3e8d0;font:16px var(--b);padding:12px 0}
.srow select,.gb{border:1px solid rgba(232,184,92,.55);background:rgba(5,8,28,.6);color:#f3e8d0;border-radius:40px;padding:11px 18px;font:15px var(--b);cursor:pointer}
.gb{color:var(--acc);border-color:var(--acc)}.gb:hover{background:var(--acc);color:#10152f}
#cf{--bw:clamp(118px,15.5vw,190px);position:relative;height:calc(var(--bw)*1.5 + 96px);perspective:1500px;margin:22px 0 4px;touch-action:pan-y}
#cf .bk{position:absolute;left:50%;top:0;width:var(--bw);margin-left:calc(var(--bw)/-2);animation:none;opacity:1;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.cv::before{content:'';position:absolute;inset:5%;z-index:2;pointer-events:none;border:1.5px solid rgba(232,190,100,.9);box-shadow:inset 0 0 0 4px rgba(0,0,0,.18),inset 0 0 0 5px rgba(232,190,100,.5)}
.cv.im::before{display:none}
.mt{margin-top:10px;text-align:center;font-size:14px;line-height:1.25;color:#f3e8d0}
.mt b{display:block;font-weight:600}.mt small{display:block;color:var(--mut);font-style:italic;font-size:12px;margin:2px 0 6px}
.pb{height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#c98a2a,#ffd27a)}
.mt span{font-size:12px;color:var(--mut)}
.now{text-align:center;color:var(--acc);font:italic 18px var(--d);min-height:1.5em}
.strip{display:flex;flex-wrap:wrap;justify-content:center;max-width:860px;margin:14px auto 0;border:1px solid rgba(232,184,92,.4);border-radius:14px;background:rgba(5,8,28,.65);backdrop-filter:blur(8px)}

.strip i{display:block;font-style:normal;font-size:24px;color:var(--acc);margin-bottom:4px}
.dua{text-align:center;font:400 clamp(28px,6vw,44px)/1.5 var(--ar);color:var(--acc);margin:26px 0 10px;text-shadow:0 0 18px rgba(232,184,92,.5)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.tile{border:1px solid rgba(232,184,92,.4);background:rgba(5,8,28,.6);color:#f3e8d0;border-radius:14px;padding:18px;cursor:pointer;text-align:left;font:16px var(--b);backdrop-filter:blur(6px);transition:.25s}
.tile:hover{border-color:var(--acc);transform:translateY(-3px)}.tile b{display:block;color:var(--acc);font:600 20px var(--d);margin-bottom:4px}.tile .pb{margin:10px 0 4px}

main{max-width:1100px;padding-top:78px;padding-bottom:50px}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);animation:dr 16s ease-in-out infinite alternate}
.a1{width:60vmax;height:60vmax;left:-20vmax;top:-10vmax;background:radial-gradient(#3a46c8,transparent 65%);opacity:.55}

.eye{font-size:11px;letter-spacing:.34em;animation:up .9s both}

 is fulfilled in a world order of justice and virtue.", "§A universal expectation§The preface notes that belief in a coming reformer is not limited to Shi’a Islam. Muslims of other schools share it, as do Christians, Jews, Buddhists and Zoroastrians. What Islam adds is a concrete person, already living, instead of an abstract idea awaiting a distant birth.", "§Twelve successors§It reports the Prophet’s sayings that twelve leaders would follow him, the first being Ali and the last the Mahdi, who is from Husayn’s ninth generation. Hundreds of reports appear in Shi’a and Sunni collections, and the preface lists the major Sunni books and works written on the Imam of the Age.", "§Signs and mission§Traditions say he will share the Prophet’s name, owe allegiance to no tyrant, and fill the earth with justice after it was filled with injustice. He will be found leaning on the Ka’bah with 313 companions, lead prayer, and Jesus will pray behind him, as a verse about Jesus’s belief before his death is read to suggest.", "§Birth and occultations§He was born in Samarra in 255 AH to Narjis and succeeded his father, Imam Hasan al-Askari, at five. The minor occultation lasted about seventy years, with contact through deputies, and was followed by the major occultation. The Abbasids regarded him as a threat, which made concealment prudent.", "§Duty while waiting§The preface closes with three Qur’anic promises (21:105, 24:55, 9:32–33) and a call to prepare: live by Islam individually, work for an Islamic order collectively, and be ready to receive him. It adds that the book joins two essays, Sadr’s replies to doubts and Mutahhari’s philosophical treatment."]], ["Who and What the Mahdi Is", ["§Aspiration and belief§Sadr begins by saying the Mahdi is both a belief in Islam and the symbol of something all peoples hold: the hope that history’s weary march ends in peace. Even dialectical materialism expects contradictions to vanish one day, so the expectation is among humanity’s most common psychological experiences.", "§Why it gives strength§Religion turns that hope into a factual belief that a world filled with oppression will be filled with justice. This is a source of virtue, because it means all injustice is to be removed, and of strength, because it lets a persecuted person resist despair, knowing oppression is an abnormal state and will not last.", "§A living, contemporary Imam§Islam makes the idea concrete. The saviour need not be awaited at birth; he already exists, shares our hopes and griefs, sees every injustice, and is ordered not to declare himself until the appointed time. That narrows the distance between the oppressed and the saviour and keeps a living bond with him.", "§Why doubts arise§Because the picture is beyond ordinary imagination, many people react negatively. Sadr says their doubts are not only intellectual; a sense that the world’s powers are invincible breeds defeatism and an inferiority complex, so people dismiss any chance of change."]], ["Seven Objections Raised", ["§Longevity and natural law§People ask how anyone can live more than a thousand years when ordinary lives pass through senility and death, and why God would suspend natural laws for one person instead of letting a leader be born and grow up when the time comes.", "§Preparation and proof§They also ask how a boy of five, whose father died in 260 AH, could be trained religiously and intellectually for such a mission, and how anyone can believe in his actual existence when the evidence is a few traditions of doubtful authenticity.", "§Delay and role§Others ask why he has not appeared after so many centuries of tragedy, how one person can turn history when circumstances produce change, and by what practical means he could overcome oppressors who hold the most destructive weapons and the greatest political, social and military power."]], ["Reply to Longevity and Suspended Laws", ["§Three kinds of possibility§Sadr distinguishes practical, scientific and logical possibility. A very long life is not logically impossible, since life does not imply early death. It is not yet practical, but nothing in science forbids it, because aging is either caused by external factors that could be controlled or by a flexible natural law.", "§Science points the same way§Animal experiments have extended lifespans, from mice by half to mosquitoes by up to threefold. Islam anticipating science is not strange: the Qur’an’s reports, such as the Prophet’s night journey, point to laws science has not yet understood, so the same knowledge could grant a long life to the last Imam.", "§Noah, miracles and exceptions§The Mahdi’s task is unprecedented, so extraordinary preparation is natural. Noah lived 950 years and rebuilt the world after the flood. If aging cannot be stopped naturally, it can be set aside as a miracle, as heat’s law was for Abraham in the fire, the sea for Moses, and the besieged house for the Prophet. Modern science says laws describe invariable association, not compulsion.", "§Why a long life helps§A leader of a world revolution needs a mind not overawed by the culture he must change, as Rousseau shuddered at a France without a king. One who watched civilisations rise and fall sees the present order as a passing stage, like the People of the Cave who woke after 309 years to find the tyrant’s power gone. He also gains broad experience and stays close to Islam’s early sources."]], ["Reply on Training and the Evidence of Existence", ["§Early Imamate as a phenomenon§Imam al-Jawad took office at eight and Imam al-Hadi at nine, so a child Imam was established fact. Sadr gives six points: the Imamate had no throne or army behind it, a vast scholarly school grew around it, with 900 scholars of Imam al-Sadiq reported in Kufa, followers demanded the highest qualifications, they suffered for it, and they kept constant contact with the Imams.", "§The test of history§Rulers opposed the Imams and would gladly have exposed any child who was merely childish. History records attempts but no failure by the child Imam. The Qur’an’s example, John given wisdom as a child, shows the pattern is old.", "§Traditions as proof§The Mahdi is mentioned in hundreds of reports, about 400 in Sunni sources and over 6,000 in all, and the traditions name him as the Prophet’s descendant through Fatima and Husayn. The twelve-successors saying is reported in over 270 versions and was recorded by Bukhari before the twelve were complete, so it cannot be a later fabrication.", "§The minor occultation as an experiment§For seventy years four trusted deputies passed on questions and the Imam’s letters, which shared the same handwriting and style. Sadr says a fraud by four unrelated men for seventy years, without a trace of suspicion, is not credible. After the deputy al-Simmari announced the end of the period, qualified mujtahids represent the Imam in a general way."]], ["Reply on Delay, His Role and His Method", ["§Why not sooner?§Even Divine missions depend on conditions. The five centuries between Jesus and the Prophet, and Lenin’s revolution depending on the First World War, show the pattern. God can intervene at critical moments, as with Abraham and the Battle of the Ditch, but chooses not to replace the natural development that tests and perfects people.", "§Ripe conditions§Modern disillusion with failed ideologies prepares hearts, and faster travel and communication make a world mission feasible. Military power matters little against a morally awakened people; many mighty civilisations fell at the first strike because they were hollow within.", "§A single leader and history§Sadr rejects the idea that individuals only reflect material forces. History is an interplay between people and circumstances, and the Prophet shows that a divinely guided person can reshape it. So the Awaited Imam can do the same.", "§Method and our duty§No one can describe his method until the stage is known. He will appear when moral decline and weariness make the world long for rescue, and he will bring a transformation based on justice. Meanwhile believers must present Islam’s system, fight superstition, and prepare themselves and the world to receive him."]], ["The Final Victory and the Expectation of Solace", ["§Four Qur’anic promises§Mutahhari starts from four promises: Islam’s final victory (9:33, 61:9), the supremacy of the righteous (21:105), the fall of tyrants like Pharaoh (28:5–6), and a bright future (7:128). He says this belief comes from the working of nature and history and from a refusal of pessimism, not wishful thinking.", "§Hope and two kinds of waiting§‘Expectation of solace’ rests on the principle that one must not despair of God’s mercy. Waiting can be constructive and dynamic, an act of virtue, or destructive and paralysing, a kind of licence. The difference comes from how one understands historical change, which he takes up next.", "§Is history chance or law?§An event is called accidental when no invariable sequence links it to a cause, but historical change as a whole follows laws. Society has its own personality, character and rules, which is why history can teach lessons.", "§What the Qur’an says§The Qur’an treats past nations as lessons, gives each a set term (7:34), says God’s way does not change (35:43), and says God does not alter a people’s condition until they alter themselves (13:11). History is therefore under Divine will and still leaves people free agents."]], ["Two Readings of History", ["§The dialectical view§Mutahhari describes the dialectical-materialist view: nature moves through contradiction, from thesis to antithesis to synthesis; in history, production is the base, classes struggle, and revolution ends the old order. In this view nothing is permanent and all values serve the means of production.", "§What is truly distinctive§He argues that motion, interconnection, contradiction and sudden change are not unique to this view, and that Islamic thought is not dialectical, since it holds some truths permanent. The truly distinctive claims are that ideas are themselves dialectical and that everything carries its own antithesis and turns into it.", "§Consequences of that view§If history has fixed stages that cannot be skipped, struggle against the old order is sacred, subversion is lawful, and partial reforms are betrayal because they delay the explosion. Conflict between ‘new’ and ‘old’ is economic, not between young and old or educated and illiterate."]], ["The Human View of History", ["§Man and evolution§The human or natural view gives central importance to man and to values. People mix higher and lower instincts. History progresses toward perfection in every sphere, as man gradually frees himself from nature and environment and holds more firmly to ideology and faith.", "§Who fights whom§Beyond class wars, this view recognises a lasting conflict between elevated, faith-driven people and brutish ones, which in Qur’anic terms is the troops of God against the troops of Satan. Risings of Abraham, Moses, Muhammad and Husayn, and movements led by the privileged, show history is not only class struggle.", "§Ten conclusions§Among them: evolutionary wars are ideological, not class wars; historical stages are not a fixed sequence, as communism arriving in countries that never had capitalism shows; armed struggle is lawful only to protect sacred rights such as freedom and faith; gradual reform is useful and sabotage unlawful; history rises and falls, as Toynbee noted, but on the whole advances; and the dialectical triangle does not describe nature."]], ["Man, History and the Ideal Society", ["§Two concepts of man§One concept sees man as a prisoner of his material interests; the other sees him as free, with innate values and the ability to control passion. The Qur’an takes the second view and describes an eternal clash between prophets and their followers on one side and tyrants like Nimrod and Pharaoh on the other.", "§Three views of the future§Some believe humanity is doomed to misery or self-destruction, a fear voiced by writers including Russell. Islam’s tidings are different: a great man will uproot corruption and establish a world government.", "§The promised order§Its features include the victory of virtue over tyranny, one world government, a fully cultivated earth, human freedom from animal impulses, fair sharing of wealth, the end of vice and of war, and harmony between man and nature.", "§Destructive and constructive expectation§The destructive notion sees corruption as a way to hasten the Mahdi and opposes reform, which Mutahhari calls a licence against Islam. The constructive notion, based on 24:55, 28:5 and 21:105, sees him as the last chapter in the long struggle of truth against falsehood, with a believing minority surviving, including a group like Husayn’s companions.", "§Sources and consensus§He closes by noting that the belief in the Mahdi is mutawatir, with almost fifty traditions in Sunni collections from 33 companions, and gives a long list of scholars who affirmed it, including Ibn Taymiyya, al-Qurtubi, Ibn Hajar, al-Suyuti and al-Shawkani."]]], "pdf": "../assets/books/The-Awaited-Saviour.pdf", "pg": [2, 7, 9, 11, 18, 24, 27, 32, 38, 44]}, {"t": "Shaykh al-Tusi’s Book of Occultation", "ar": "كتاب الغيبة", "c": "Imam al-Mahdi", "h": 18, "au": "Shaykh al-Tusi", "ch": [["Translator’s Preface and Life of Shaykh al-Tusi", ["§The man§Shaykh al-Tusi was born in 385 AH in Tus and moved to Baghdad in his early twenties, studying under Shaykh al-Mufid and then Sayyid Murtadha. After Murtadha’s death he became the leading scholar of the Shi’a.", "§Hardship and Najaf§Political unrest and the burning of his library in Baghdad pushed him to settle in Najaf, where he founded the seminary that became a centre of learning. The preface lists his students and his writings by subject.", "§Works§His output spans theology, jurisprudence and its principles, Qur’anic commentary, hadith collections, supplications, rijal (biographies of narrators), history and replies to objections. This book belongs to the first group."]], ["Aim and the Three Principles", ["§Purpose§In his preface the author promises to explain why the twelfth Imam is in occultation, why the occultation is prolonged, what stops his reappearance, and what benefit the Ummah still receives from him.", "§Imamate is necessary§The first principle is the necessity of an Imam to guide people and uphold religion. Al-Tusi answers the objections of those who deny the Imamate, using rational argument.", "§Infallibility and truth§The second principle is that the Imam must be protected from sin and error. The third is that truth never leaves the Muslim community, with the testimony of the Black Stone for Imam al-Sajjad as an example."]], ["Refuting the Nawusiyya and Waqifiyya", ["§Imam al-Kazim§A long section gathers reports on Imam Musa al-Kazim’s martyrdom and his explicit declaration that Imam al-Ridha would succeed him.", "§The Waqifa§Al-Tusi rejects those who stopped at al-Kazim and said he would return. He explains what produced the sect, including money held in trust, cites traditions condemning them, and recalls miracles of Imam al-Ridha.", "§Birth of al-Jawad§He also answers objections about the birth of Imam al-Jawad, meeting the argument that the line of Imams would be cut off."]], ["The Wisdom of the Occultation", ["§A hidden Imam still benefits§The author explains the difference between a hidden Imam and an absent one who does not exist. People still benefit from his existence, and he guides indirectly where open authority is impossible.", "§Divine penalties and truth§He discusses how religious penalties apply during occultation, answers objections from two senior Sunni scholars, and explains how truth is discerned, drawing on Sayyid Murtadha.", "§Why he is hidden§The Imam is hidden from his followers because of fear for his life. His concealed birth was not extraordinary, since Moses’s birth was also hidden, and his whereabouts remain secret.", "§Precedents§He gives examples of occultation: Khidr, Moses, Joseph, Jonah, the People of the Cave and the owner of the donkey."]], ["Reports of Long-Lived Persons", ["§Arabs§Al-Tusi collects accounts of long-lived Arabs such as Luqman ibn Ad, Rabi ibn Dabi, Mustaughar ibn Rabia, Aktham ibn Sayfi, Duraid ibn Simma, Mohsin ibn Ghassan, Amr ibn Hamama, Abd al-Masih ibn Buqayla and Nabigha al-Ja’di, with their reported lifespans and verses.", "§Non-Arabs§He adds Persians and others with long lives, such as Yarub ibn Qahtan and Jalhama ibn Adad, and mentions the Dajjal. The point is that long life is recorded in history and is not a new or impossible claim."]], ["The Twelve Imams and Reports of Occultation", ["§Twelve in number§He gathers Sunni reports that the Prophet’s successors number twelve, and gives the full text of the Tablet of Fatima, which lists them.", "§Occultation foretold§Traditions from the Imams predict the occultation and the uprising of the Mahdi. They place him in the line of Ali and Fatima and in Husayn’s descendants.", "§Refuting mistaken beliefs§He rejects those who say the Mahdi is not Imam Husayn’s descendant, those who deny Ali’s Imamate or Muhammad ibn al-Hanafiyya’s Mahdiship (Kaysaniyya), and the Muhammadiyya and Waqifiyya."]], ["Imam al-Askari and Rival Sects", ["§The Imamate of al-Askari§Al-Tusi establishes Imam al-Hasan al-Askari’s Imamate, discusses the death of his brother Sayyid Muhammad in their father’s lifetime, and lists his miracles.", "§Eight rival claims§He refutes those who said al-Askari did not die, or will return, or that there is no Imam after him; those who followed his brother Ja’far; those who said he left no child; those who called the matter confusing; those who ended the Imamate with him; and those who held there are thirteen Imams."]], ["Evidence of the Birth, Eyewitnesses and Epistles", ["§The birth§He presents the evidence for the birth of the Master of the Age.", "§Those who saw him§A long chapter gives the reports of people who said they saw the Imam in his lifetime and during the occultation.", "§Miracles and letters§He lists miracles during the occultation and the epistles issued in the Imam’s name, which address the community’s questions."]], ["Delay and the Test of the Shi’a", ["§Why the reappearance is delayed§The author gives the causes of delay, which include conditions not yet being right and the fear that holds the Imam back.", "§A test for believers§The occultation tests the Shi’a, separating those whose belief is firm from the wavering."]], ["The Emissaries", ["§Approved agents§He profiles trusted agents of the Imams, including Humran ibn A’yan, Mufaddal ibn Umar, Mu’alla ibn Khunays and Ali ibn Mahziyar.", "§Condemned agents§He lists those the Imam condemned, such as Salih ibn Muhammad, Faras ibn Hatim and Ahmad ibn Hilal.", "§The four special deputies§He gives detailed accounts of the four: Uthman ibn Sa’id, Muhammad ibn Uthman, Husayn ibn Rauh (with the questions of Himyari and his excellence) and Ali ibn Muhammad al-Simmari.", "§False claimants§He lists men who falsely claimed deputyship, including al-Shalmaghani, al-Hallaj, Ibn Abi Azaqir and others, and records the appointees of the four deputies."]], ["Lifespan, Time of Reappearance and Signs", ["§Long life and the time§He discusses the Imam’s long life and rejects fixing the time of reappearance. Reports that seem to contradict this are explained and reconciled.", "§Signs§A long section lists the signs expected before the reappearance.", "§Character§The book closes with the Imam’s qualities, practices and manners on his reappearance."]]], "pdf": "../assets/books/Al-Ghayba.pdf", "pg": [4, 17, 35, 78, 97, 107, 137, 157, 211, 218, 260]}, {"t": "Mikyal al-Makarim, Vol. 1", "ar": "مكيال المكارم", "c": "Imam al-Mahdi", "h": 160, "au": "Sayyid Muhammad Taqi Musawi Isfahani", "ch": [["Dedication, Author and Preface", ["§Opening§The volume begins with a dedication, a short biography of Ayatullah Sayyid Muhammad Taqi Musawi Isfahani and his preface, which explains why he wrote the book.", "§Idea of the book§Its theme is the benefits of praying for the Qa’im: to show that supplication for the Imam of the Age is an obligation of gratitude and love, and brings rewards for the believer."]], ["Part 1: Recognising the Imam of the Time", ["§Rational proof§The author gives three rational arguments for why it is necessary to recognise the Imam of one’s time.", "§Textual proof§He then gathers the verses and narrations that make knowing the Imam a duty, with a note to close the section."]], ["Part 2: Proofs of His Imamate", ["§Traditions§Some widely reported traditions that point to the Imamate of Hujjat ibn al-Hasan.", "§Miracles§A section on miracles and healings attributed to him."]], ["Part 3: His Rights over Us", ["§Six rights§He lists six rights: our existence and being; our survival in the world; the Imam’s kinship with the Prophet; the right of a benefactor; the right of a father over his son; and the right of a master over his servants and dependants.", "§Purpose§Each right is argued from traditions to show why gratitude takes the form of prayer and service."]], ["Part 4, Alif to Dhal: Qualities and Merits", ["§Method§The longest part follows the Arabic alphabet, taking a quality or merit of the Imam for each letter, to show why praying for him is a duty.", "§Alif§Faith in God; enjoining good; answering our prayers through his blessing; favour upon us; making lawful the rights due to him; seeking his help; helping oppressed Shi’a; security of roads and cities at his reappearance; reviving religion; vengeance on God’s enemies; applying penalties; and his distress.", "§Ba to Tha§Generosity, establishing proof and guidance, his trials and blessings; uniting people, mercy, bearing pain, giving up his right, attending our dead, rebuilding Islam after ruin, completing the matter, and the Qur’anic teachings collected by Ali; and the reward of good deeds and revenge for Husayn.", "§Jim to Dhal§His beauty, flow of sustenance, jihad, uniting people on monotheism, assembly of helpers from angels and jinn; protection of Islam, war against opponents, Hajj, the earth’s survival through him, forbearance, revival of some saints, love, judging with truth; manners, fear of God, caliphate, perfection of knowledge, rising with the sword; his prayer for believers, his call, warding off calamities, disgrace of enemies."]], ["Part 4, Ra to Ghayn: Conduct and Occultation", ["§Ra to Sad§Vigil and comfort; struggle, piety and visiting Husayn’s grave; conduct and charity; valour, intercession, testimony and nobility; patience; and hospitality.", "§Ta and Za§Purifying the earth of injustice and recovering rights; the appearance of truth, victory, the enemies’ injustice and the manifestation of the Imams’ perfections.", "§Ayn§His knowledge, the respect of saints at his reappearance, punishment of enemies, justice, turning desires toward guidance, bestowals, seclusion and worship.", "§Ghayn§The long treatment of his occultation, including the test and trial of the people, his distance from home, victory of Muslims through his reappearance, and self-sufficiency of believers."]], ["Part 4, Fa to Qaf: Relief and Justice", ["§Fa§His grace and generosity; separating truth from falsehood; relief (faraj); the conquest of lands; opening of the red scroll for vengeance; and the joy of believers.", "§Qaf§Eliminating unbelievers, slaying Satan, strengthening the bodies and hearts of believers, paying their debts, fulfilling their needs, judging with truth, his kinship to the Prophet, his equity, and the elimination of the Dajjal."]], ["Part 4, Kaf: His Perfections", ["§Likeness to the prophets§A long section shows his resemblance to prophets, from Adam, Abel, Seth, Noah, Idris, Hud, Salih, Abraham, Ishmael, Isaac, Lot, Jacob, Joseph, Khidr, Elijah and Dhul-Qarnayn to Moses, Aaron, Joshua, David, Solomon, Daniel, Job, Jonah, Zechariah, John and Jesus, and to the Seal of the Prophets.", "§Likeness to Imams§He compares him to the infallible Imams and to Imam Husayn.", "§Generosity§Munificence, explaining knowledge to people, and relieving hardships."]], ["Part 4, Lam to Ya: Light and Guardianship", ["§Lam and Mim§His banner; vigil in God’s path, miracles, hardships and calamities, and mutual love with believers.", "§Nun: benefit and light§Benefits, including those of his occultation, and a long discussion of his light: its meaning, luminosity as nobility, his being a light, illumination in the worlds, and his bounties, help of Islam, call and advice.", "§Waw, Ha, Ya§His wilayat; his sorrow, destroying the lairs of unbelief, guiding people and his migration; his bounty and auspiciousness."]], ["Part 5, Benefits 1 to 20", ["§Gratitude and love§Prayer for the Imam brings his tawqee, increase in blessings (since thanking God for a blessing increases it and he is a blessing), the expression of inner love and a sign of awaiting.", "§Protection§It revives the Imams’ command, causes distress to Satan, brings deliverance from the mischiefs of the last age, and partly fulfils his rights.", "§Intercession§A long discussion defines intercession, gives proofs, names intercessors on judgment day, and explains who is eligible, including that praying for the reappearance makes one eligible.", "§Further§Means of nearness to God, acceptance of prayer, recompense for the Prophet’s mission through love, protection from calamity, forgiveness of sins, and chances of meeting the Imam in person or in sleep."]], ["Part 5, Benefits 21 to 48", ["§Return and hastening§Return in his time, brotherhood with the Prophet, and hastening of the reappearance, with discussion of bada and whether it can be advanced or delayed.", "§Covenants and trust§Following the Prophet and Imams, fulfilling the divine covenant, the reward of those who do good, keeping the trust, spreading his light in the supplicant’s heart, and increased lifespan.", "§Rewards§Cooperation in good, God’s help, guidance by the Qur’an, being known to the People of the Heights, reward of knowledge, security from punishment, good news at death, and standing with Ali.", "§Further§Respect for those of higher station, avenging Husayn’s blood, and eight further noble benefits."]], ["Part 5, Benefits 49 to 90", ["§Judgment day§Bright light, intercession for seventy thousand sinners, entering Paradise without accounting, safety from thirst, eternal Paradise, a special gift, God’s shade, and angels seeking forgiveness.", "§Standing§God’s pride in the supplicant, being best after the Imams, obeying those in authority, God’s pleasure, the Prophet’s happiness, easy accounting, a kind companion in barzakh, and the removal of sorrow.", "§In occultation§Praying during occultation is better than many acts, angels pray for the one who prays, and Imam al-Sajjad’s prayer for supplicants.", "§Attachment§Clinging to the Two Weighty Things and the divine rope, perfecting faith, martyrs’ rewards, joining the party of the Imams, rank in Paradise, and the intercession of Lady Fatima with twelve conclusions, such as the rewards of Hajj, Umrah and fasting."]]], "pdf": "../assets/books/Mikyal-al-Makarim-Vol-1.pdf", "pg": [3, 8, 19, 32, 42, 101, 141, 169, 244, 305, 384, 485]}, {"t": "Mikyal al-Makarim, Vol. 2", "ar": "مكيال المكارم", "c": "Imam al-Mahdi", "h": 200, "au": "Sayyid Muhammad Taqi Musawi Isfahani", "ch": [["Part 6: Daily Times for Praying for the Imam", ["§After the obligatory prayers§Part 6 lists times when praying for the Imam of the Age is especially emphasised. It begins with the end of every obligatory prayer, with special mention of after Zuhr, Asr and Morning prayers.", "§Night prayer and qunoot§It continues with after every two rak’ats of the night prayer, in the qunoot of prayers, in prostration and in the thanksgiving prostration.", "§Through the day§Each morning and evening, and the last part of every day, are also named, with the supplications transmitted for these moments."]], ["Part 6: Weekly and Yearly Occasions", ["§The week§Thursday, the eve of Friday and Friday itself, with sub-times: after the morning prayer, during the afternoon, on the way to the mosque, after Asr, in the qunoot of Zuhr and the Friday prayer, in the sermon and at the end of the day.", "§Festivals and special days§Nowruz, the Day of Arafah, Eid al-Fitr, Eid al-Adha, the Day of the Earth’s Expansion (Dahw al-Ard), Ashura, the eve and day of mid-Sha’ban, and Ghadir.", "§Ramadan and Muharram§The whole of Ramadan and particular nights and days (the 6th, 8th, 12th, 13th, 18th, 19th and 21st), as well as the month of Muharram."]], ["Part 6: Occasions of the Heart and Holy Places", ["§Moments of feeling§After remembering Husayn’s tragedy, after reciting the pilgrimage text for the Imam of the Age, while weeping out of fear of God, after any renewed blessing or the loss of one, in sorrow and hardship, after the tasbih prayer, and before praying for oneself and one’s family.", "§Wide and special times§At any time of day or night, while sitting in a gathering of opponents, and in a forty-day period of continuous prayer for his reappearance.", "§Places§Masjid al-Haram, Arafat, the Cellar (Sardab), places linked to the Twelfth Imam, the shrines of Imam Husayn and Imam Reza, of Imam Hadi and Imam Askari, and the shrine of every Imam."]], ["Part 7: The Value of Praying for His Reappearance", ["§First aim§Preliminary points that clarify what praying for the hastening of the reappearance means and why it is meaningful.", "§Second aim§The value of praying specifically for the hastening of the reappearance.", "§Third aim: supplications§Supplications transmitted from the Imams: the Salawat prayer, the dua of Imam Reza, the dua for the period of occultation, the Qunoot prayer, the Nudba (lament) supplication, and another dua."]], ["Part 8, Duties 1 to 10: Knowing, Loving, Awaiting", ["§Knowledge and respect§Learning his particular qualities and being respectful when mentioning him, with reminders.", "§Love§Loving him, with rational and textual proof; and making him known among people.", "§Awaiting§Five issues on waiting: its excellence and reward; waiting for the Mahdi; the real meaning of intizar; whether waiting needs the intention of seeking nearness; and waiting as the opposite of despair.", "§Longing and gatherings§Longing to see him, telling of his praiseworthy qualities, grief at his separation, attending assemblies where his virtues are described, and organising such gatherings, with a note on a point of jurisprudence."]], ["Part 8, Duties 11 to 22: Poetry, Weeping, Supplication, Signs", ["§Expression§Composing and reciting poetry in his praise, and standing in respect at the mention of his name.", "§Sorrow§Feeling sorrow at his separation, with a section on weeping for the Imam of the Age.", "§Prayer§Asking God for knowledge of him, praying for him regularly and steadfastly, and reciting supplications during the occultation.", "§Signs and patience§Knowing the signs of the reappearance, with rational and textual proof and some testimonies, and being submissive yet eager, with traditions from the Imams and a section on the kinds of haste that are condemned."]], ["Part 8, Duties 23 to 38: Giving and Serving", ["§Charity and pilgrimage§Giving charity on the Imam’s behalf and for his safety, performing Hajj for him or sending someone, tawaf for him, visiting the Prophet and Imams on his behalf, and sending a pilgrim.", "§Striving and help§Striving for him, organising help, and a firm intention to support him if he reappears.", "§Allegiance§Renewing the oath of allegiance at his hands every day or every Friday, with discussion of what bay’at means.", "§Helping others§Helping with one’s wealth, assisting pious Shi’a and the Imam’s friends, pleasing believers, and wishing him well, with an explanation and a reminder."]], ["Part 8, Duties 39 to 56: Devotion and Patience", ["§Pilgrimage and gifts§Visiting him in prayer, meeting righteous believers, sending blessings on him, and gifting the reward of prayers to him, including special prayers gifted to Ali, Fatima, and each of the Imams.", "§Recitation and tawassul§The reward of reciting the Qur’an for him, asking God through him, addressing him in supplication, and inviting people to him.", "§Humility and knowledge§Taking care of his rights, soft-heartedness while remembering him, and scholars making their knowledge evident.", "§Steadfastness§Practising taqiyya with mischief-makers, bearing hardship and denial, praying for patience in his separation, urging patience, and not sitting where he is disrespected."]], ["Part 8, Duties 57 to 68: Character and Respect", ["§Prudence§Feigning support for tyrants where necessary, avoiding fame, and personal improvement.", "§Unity and repentance§Unity and cooperation in helping him, sincere repentance and fulfilling others’ rights, and remembering him while acting on his teachings.", "§Remembrance§Praying not to lose his remembrance, humbling oneself for him, and giving his wishes precedence over one’s own.", "§Respect§Respecting those close to him and venerating the places he has visited, with discussions on honouring those places."]], ["Part 8, Duties 69 to 80: Closing Duties", ["§Caution§Not fixing the time of reappearance, and denying anyone who falsely claims to be his deputy during the occultation, with discussions and two points.", "§Seeing and following§Praying to see the Imam with forgiveness, following him in moral conduct, and restraining the tongue except in remembrance of God.", "§Devotion§His own prayer, weeping for Imam Husayn, visiting Husayn’s tomb, cursing the Umayyads, and taking an active part in fulfilling the rights of brothers.", "§Final duty§Awaiting the reappearance and preparing for it. A bibliography closes the volume."]]], "pdf": "../assets/books/Mikyal-al-Makarim-Vol-2.pdf", "pg": [3, 33, 53, 64, 118, 173, 206, 257, 298, 324]}, {"t": "Kamaluddin wa Tamamun Ni’ma, Vol. 1", "ar": "كمال الدين", "c": "Imam al-Mahdi", "h": 145, "au": "Shaykh as-Saduq", "ch": [["Preface, Martyrdom of Imam al-Askari and Objections", ["§Background§Kamaluddin wa Tamamun Ni’ma, by Shaykh as-Saduq (Ibn Babawayh), is the classic work on the occultation of the Twelfth Imam, translated into English by Sayyid Athar Husayn S.H. Rizvi.", "§Narrations on al-Askari§The opening gathers narrations that establish the martyrdom of Imam Hasan al-Askari and replies to objections, including those of Ibn Bishar.", "§Refuting the Zaydiyya§It includes the statements of shaykhs in refutation of the Zaydiyya sect."]], ["An Imam in Occultation Who Will Return", ["§The argument§Saduq sets out the argument for an Imam in occultation who will reappear to fill the earth with justice and fairness.", "§Eight objections§He answers eight objections of the Zaydiyya one by one and then examines the doubts of opponents and their removal.", "§The atheist debate§The section ends with the author’s debate with an atheist in the court of Rukn ad-Dawla."]], ["Chapters 1 to 7: Occultation among the Prophets", ["§Idris, Noah and Salih§Chapters on the occultation of Prophet Idris, the reappearance of Noah, and the occultation of Salih show that hidden leaders are a recurring pattern.", "§Abraham and Joseph§The occultation of Abraham and Joseph follows, with narrations about their concealment and return.", "§Moses and successors§The occultation of Moses, then his death and the occultation of successors and divine proofs up to Jesus."]], ["Chapters 8 to 14: Who Foretold the Prophet", ["§Jesus and Salman§Jesus’s prophecies of Muhammad’s coming, and Salman al-Farsi’s report of his search for the Prophet.", "§Arab witnesses§The report about Quss ibn Sa’ida al-Iyadi, the report of Tubba’, and the reports concerning Abd al-Muttalib and Abu Talib.", "§Others§Saif ibn Dhi Yazan’s report, and Bahira the monk, who is said to have recognised the signs of the Prophet."]], ["Chapters 15 to 20: More Reports of the Prophet’s Coming", ["§Monks and soothsayers§The reports of the great monk met on the way to Syria, Abul Moheeb the recluse, and Satih the soothsayer.", "§Others§The report of Yusuf the Jew, Ibn Hawash of Damascus, and Zayd ibn Amr ibn Nufayl.", "§Purpose§Together they show that the arrival of a promised figure was expected and recognised before it happened, supporting belief in the final promised Imam."]], ["Chapters 21 and 22: The Imam in Every Age", ["§Necessity§Chapter 21 argues that the earth cannot be without an Imam or divine proof in any age.", "§Succession from Adam§Chapter 22 traces the continued succession of proofs from Adam and discusses the meaning of terms such as ‘itra, aal, ahl, dhurriyya and sulala."]], ["Chapters 23 to 29: Texts Naming the Qa’im", ["§From God and the Prophet§The nass of God for the Qaim as the twelfth Imam, then the Prophet’s nass, and his statements about the coming occultation.", "§Ali, Fatima and the Tablet§Amir al-Mu’minin’s statements about the occultation of the Twelfth Imam, the narration of Lady Fatima, and the nass of the Qaim in the Tablet that God gave to his Messenger.", "§Imam Hasan§Imam al-Hasan ibn Ali’s statements that the occultation will occur and that the Qaim is the twelfth Imam."]]], "pdf": "../assets/books/Kamaluddin-Vol-1.pdf", "pg": [6, 73, 134, 167, 194, 207, 255]}, {"t": "Kamaluddin wa Tamamun Ni’ma, Vol. 2", "ar": "كمال الدين", "c": "Imam al-Mahdi", "h": 135, "au": "Shaykh as-Saduq", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAGyASwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJ aim as the twelfth Imam and foretell his occultation.", "§Sources§The reports are traced through chains of narrators from the Prophet and the Imams in succession."]], ["Hisham ibn Hakam’s Debate on the Occultation", ["§The debate§It records a debate of the early scholar Hisham ibn Hakam concerning the occultation.", "§Why included§It shows how the question of a concealed Imam was already argued in the Imams’ own time."]], ["The Narration of Khidr", ["§Khidr§A narration about Khidr, used by Saduq as a precedent: a divinely guided figure whose long life and hidden presence do not contradict reason or revelation."]], ["Narrations on Dhul-Qarnayn", ["§Dhul-Qarnayn§Narrations about Dhul-Qarnayn, the righteous ruler of the Qur’an.", "§Parallel§They are cited to show a pattern in earlier peoples that the occultation of the Qaim parallels."]], ["Imam al-Askari on His Son", ["§Nass in favour of his son§Narrations of Imam Hasan al-Askari concerning the nass in favour of his son, al-Qaim, the Master of the Time.", "§Purpose§They give the Imam’s own words about his successor."]], ["Congratulations on the Birth", ["§The birth§A long section recounts those who congratulated Imam al-Askari on the birth of his son, the Qaim, including a letter from the Imam announcing the birth and asking for it to be kept secret.", "§Reports§The accounts are narrated in detail with chains of narrators and give the circumstances of the birth and the joy of the Shi’a."]], ["Epistles from the Master of the Age", ["§Letters§Letters issued by the Master of the Age, including to his deputy al-Amari and his son, narrated by Sa’d ibn Abdullah.", "§Content§They address the questions of the community and warn people against searching out what God has kept hidden."]], ["Long Lives, Occultation and Earlier Communities", ["§Long-lived people§A long section argues that very long lives are not impossible, citing Noah’s 950 years and gathering accounts and verses of long-lived Arabs.", "§Patterns of the past§It cites the Prophet’s saying that what happened in earlier communities will happen in this one in the same order."]], ["The Tale of Bilohar and Yuzasif", ["§A moral story§The book closes with a long tale of a king, his son and a wise ascetic, in which the prince learns detachment from the world.", "§Meaning§It is included as an instructive parable that ends the work."]]], "pdf": "../assets/books/Kamaluddin-Vol-2.pdf", "pg": [15, 38, 54, 57, 68, 88, 141, 142, 194]}, {"t": "Hayat al-Qulub, Vol. 1", "ar": "حياة القلوب", "c": "Prophets", "h": 40, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Why Prophets Were Sent", ["§Purpose§The book opens by explaining why God sent prophets: because humans cannot know their own good unaided, a wise Creator who is unseen must send messengers with clear proofs.", "§Miracles and infallibility§Prophets bring miracles as proof and are protected from sin and error. The chapter discusses the infallibility of prophets and Imams and the merits of the prophets and their successors."]], ["Adam and Hawwa", ["§Merits and names§The merits of Adam and Hawwa and the reasons for their names.", "§Creation§God informs the angels of Adam’s creation and commands them to prostrate, as the Qur’an describes, and the long account covers events in Paradise.", "§Descendants§An account of Adam’s children and their lineage, the martyrdom of Habil (Abel), revelations to Adam, and his death, age and bequest to Shith (Seth)."]], ["Idris and Nuh", ["§Idris§An account of Idris, one of the early prophets.", "§Nuh§Nuh’s birth, death and lifespan, followed by his long proclamation to his people, the flood, and the ark."]], ["Hud, Salih and Their Peoples", ["§Hud§The circumstances of Hud and his people, including Shaddad and the city of Iram.", "§Salih§Salih, his she-camel and his people, who were destroyed after rejecting him."]], ["Ibrahim and Lut", ["§Ibrahim§Ibrahim’s merits and morals, and his trials and righteous sons, in the longest account of the early prophets.", "§Lut§The account of Lut and his people."]], ["Dhul-Qarnayn, Ya’qub and Yusuf", ["§Dhul-Qarnayn§Dhul-Qarnayn, the Qur’an’s great traveller and ruler.", "§Ya’qub and Yusuf§A long account of Ya’qub and Yusuf: his dream, his brothers’ jealousy, the well, Egypt, imprisonment, rise to power and reunion with his family."]], ["Ayyub, Shu’ayb, Musa and Harun", ["§Ayyub and Shu’ayb§Ayyub (Job) and his patience, and the prophet Shu’ayb.", "§Musa and Harun§The longest account: their mission to Pharaoh, Asiya the wife of Pharaoh, the Israelites after the Exodus, the revelation of the Torah and their disobedience, and Qarun.", "§The cow and Khidr§The slaughter of the cow, Musa’s meeting with al-Khidr, the teachings revealed to Musa, and the deaths of Musa and Harun."]], ["Hizqil, Isma’il, Ilyas, Yusha’, Dhulkifl and Luqman", ["§The prophets§Brief accounts of Hizqil (Ezekiel), Isma’il, Ilyas and Yusha’ (Joshua) and Dhulkifl.", "§Luqman§Luqman and his words of wisdom, including counsel to his son."]], ["Talut, Jalut, Dawud and Sulayman", ["§Talut and Jalut§The story of Talut (Saul) and Jalut (Goliath).", "§Dawud§Dawud’s merits, perfections and miracles, his lapse (tark al-awla), and the revelations upon him.", "§Sulayman§Sulayman’s merits and miracles, his account with Bilquis, and the laws and revelations to him."]], ["Saba, Ras and Other Peoples", ["§Peoples§Accounts of the people of Saba, the people of Tharthar, the people of Ras, the violators of the Sabbath, and Shaiya and Haiqooq."]], ["Zakariyya, Yahya, Maryam and Isa", ["§Zakariyya and Yahya§The accounts of Zakariyya and Yahya (John), including his martyrdom.", "§Maryam§Maryam, the mother of Isa.", "§Isa§Isa’s birth and merits, his sending of messengers, the descent of the table (Ma’idah), the revelations and teachings given to him, and his ascension to heaven and return to earth."]], ["Irmiya, Daniel, Uzair, Yunus and the Cave", ["§The prophets§Irmiya (Jeremiah), Daniel and Uzair, and Yunus ibn Matta and his father.", "§The Cave§The People of the Cave and the Inscription, and the makers of the pit."]], ["Jirjis, Khalid ibn Sinan, Sages and Rulers", ["§Prophets and sages§Accounts of Jirjis (George), Khalid ibn Sinan, and some unnamed messengers; stories of sages and pious people of the Israelites.", "§Rulers and the angels§Accounts of rulers and kings, and the story of Harut and Marut."]]], "pdf": "../assets/books/Hayat-al-Qulub-Vol-1.pdf", "pg": [5, 31, 97, 120, 138, 197, 265, 372, 397, 446, 454, 533, 576]}, {"t": "Hayat al-Qulub, Vol. 2", "ar": "حياة القلوب", "c": "Prophet Muhammad", "h": 300, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Ancestry and the Time before the Mission", ["§The Prophet’s light§The Creation of the Prophet’s light and his noble ancestors.", "§Mecca’s history§The Army of the Elephant, the digging of Zamzam, the sacrifice of Abdullah, and the condition of Arabs and Meccans before the Prophet’s coming."]], ["Prophecies, Birth and Childhood", ["§Prophecies§Prophecies about the Prophet, the date of birth and miraculous events surrounding it.", "§Early life§Events and miracles from infancy to the first revelation, the virtues of Lady Khadija and her marriage with the Prophet, and his honourable names."]], ["Appearance, Character and Virtues", ["§Description§His appearance, character, physique, habits and conduct.", "§Excellence§His virtues and specialties, the duty to obey, love and respect him, his freedom from sin and error, his knowledge and heritage of earlier prophets."]], ["The Qur’an and the Unseen", ["§Miracle§A very long section on the Qur’an as the Prophet’s lasting miracle.", "§Unseen§The Prophet’s reports about the unseen."]], ["The Call and the Ascension", ["§Prophetic office§The Prophet assumes the prophetic office.", "§Ascension§The Ascension (Mi’raj) of the Prophet, in a long account of what he saw."]], ["Persecution and the Migration", ["§Hardship§Migration to Abyssinia, confinement in the valley of Abu Talib, and the events leading to  events afterwards, and the incidents at his tomb."]]], "pdf": "../assets/books/Hayat-al-Qulub-Vol-2.pdf", "pg": [6, 58, 159, 223, 384, 450, 489, 572, 616, 656, 703, 739, 789, 950]}, {"t": "Hayat al-Qulub, Vol. 3", "ar": "حياة القلوب", "c": "Imamate", "h": 330, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Chapter 1, Parts 1 to 3: Imam in Every Age", ["§Part 1: necessity§Majlisi starts from the principle that an Imam is essential and the earth is never without one, using Qur’anic verses and narrations.", "§Part 2: infallibility§The Imam must be free from all sin and error, and he gives four arguments.", "§Part 3: designation§Imamate is established by explicit appointment, supported by eight arguments and by verses on the appointment of the Imams."]], ["Chapter 1, Parts 4 to 9: Knowing and Obeying", ["§Knowing§It is mandatory to know the Imam of the time, and denying one Imam is like denying all.", "§Obeying§It is obligatory to obey the true Imams, and there is no guidance except through them.", "§Hadith§The Hadith of the Two Weighty Things and similar traditions, and traditions that name all the Imams."]], ["Chapter 2, Parts 1 to 5: Verses on the Imams’ Status", ["§Overview§Chapter 2 gathers Qur’anic verses revealed in general terms whose interpretation, according to narrations, refers to the status of the Ahl al-Bayt.", "§Part 1 to 3§‘Peace be upon Ilyasin’, ‘Dhikr’ as the Ahl al-Bayt, and those who have the knowledge of the Qur’an as the Imams.", "§Part 4 and 5§The Imams as the signs and proofs, and as the most exalted and respected."]], ["Chapter 2, Parts 6 to 9: Love and Following", ["§Love and family§The necessity of love and devotion for the Ahl al-Bayt, and verses where ‘parents’ and ‘children’ mean the Prophet and the Imams.", "§Trust and following§‘Trust’ as Imamate, and verses proving the following of the Ahl al-Bayt."]], ["Chapter 2, Parts 10 to 13: Light and Witnesses", ["§The Verse of Light§A long exegesis of the Verse of Noor.", "§Witnesses§The purified Imams as witnesses over creatures, traditions about believers and belief, and traditions on the Imams as helpers of God."]], ["Chapter 2, Parts 14 to 20: Path, Truth, Wilayat", ["§Paths and truth§Words like Sirat and Sabil as the Imams, and verses using ‘truth’.", "§Good deeds and bounty§‘Good deeds’ and ‘bounty’ understood as Wilayat.", "§Cosmic images§The sun, moon, stars and firmament as the Imams, the strong rope and firmest handle, and ‘wisdom’ and those endowed with understanding."]], ["Chapter 2, Parts 21 to 30: Titles in the Qur’an", ["§Titles§‘Companions of a known place’, the satisfied folk in Paradise, ‘Naas’ (people), the ocean of pearls and corals, and other expressions.", "§Further§‘Nahl’ as the Imams, the seven oft-repeated verses, ‘scholars’, ‘those who examine’, and the last verses of Surah Furqan."]], ["Chapter 2, Parts 31 to 36: Tree, Caliphs, Word", ["§The tree§The consecrated tree as the Ahl al-Bayt, and verses pointing to the Imams.", "§Leadership§‘Imam’ or ‘Ummah’ in the Qur’an, ‘Salam’ and ‘Islam’ denoting the Imams, and the Imams as God’s appointed caliphs.", "§Word§‘Kalimah’ and ‘Kalam’ as Wilayat."]], ["Chapter 2, Parts 37 to 43: Grace, Angels, Patience", ["§Sanctity and justice§The Ahl al-Bayt in the sanctity of God, and justice, goodness and the scales as Wilayat, with ‘side’, ‘face’ and ‘hands’ of God.", "§Grace and angels§The Imams and their Shi’a as recipients of grace, and the angels’ love and regard for the Imams.", "§Patience and afflictions§Patience for the Imams and their Shi’a, and verses that speak of the Imams’ afflictions and tragedies."]]], "pdf": "../assets/books/Hayat-al-Qulub-Vol-3.pdf", "pg": [5, 45, 79, 105, 145, 215, 260, 292, 323]}, {"t": "Haqq al-Yaqin", "ar": "حق اليقين", "c": "Beliefs", "h": 270, "au": "Allamah Muhammad Baqir al-Majlisi", "ch": [["Introduction and the Creator", ["§Scope§Haqq al-Yaqin, by Allamah Majlisi, is a comprehensive treatise on the principles of belief, with a publisher’s preface and translator’s foreword before the main text.", "§Chapter 1: the Creator§Ten sections: admitting the existence of the Creator; His eternality; omnipotence; all-knowing; all-seeing and hearing; living; willing; speaking; truthful; and qualities of perfection."]], ["Negative Attributes and God’s Acts", ["§Chapter 2§The negative attributes: God is one; not composite, a body or in place; unique; not seen by eyes; not incidental; the meaning of divine names; He does not incarnate; and has no partner in eternality.", "§Chapter 3§Qualities linked to His acts: the reality of good and evil; He does no evil; He does not impose beyond capacity (with three reasons); grace is obligatory on Him; and He is wise."]], ["Chapter 4: Prophethood", ["§Objectives§Infallibility, miracles, qualities of prophets, the superiority of prophets and Imams over angels, and the prophethood of Muhammad (S).", "§Proofs of Muhammad§The Qur’an as everlasting miracle, with eight reasons including eloquence, uniqueness and freedom from flaws, and miracles related to his body, birth, heavens, plants, animals, prayers and victories.", "§Further topics§The Ascension, merits of the Prophet, whether he was sent to angels, his religion before the proclamation, his being unlettered (Ummi), and eighteen specialities."]], ["Chapter 5: Imamate, Necessity and Qualities", ["§Necessity§Five reasons Imamate is necessary, including that appointing an Imam is a grace, all prophets appointed successors, and five proofs that it is like prophethood.", "§Requirements§Requirements for Imamate and eight qualifications: infallibility, knowledge, valour, superiority, freedom from defects, being best in God’s view, miracles, and general Imamate.", "§Specialties and recognition§Specialties of the Imam and how to recognise him."]], ["Chapter 5: Imam Ali’s Imamate and Exclusive Qualities", ["§Verses and reasoning§Verses and rational and textual arguments for the Imamate and superiority of Amir al-Mu’minin.", "§Twenty-one qualities§Twenty-one exclusive qualities of Imam Ali, discussed one by one with reasons and proofs."]], ["Chapter 5: Hadiths of Both Schools", ["§Ghadir§A long section on the tradition of Ghadir Khumm, including the meaning of ‘mawla’.", "§Other traditions§The Hadith Manzilah; Ali’s love for God and the Prophet; the brotherhood with the Prophet and closing of the companions’ doors; the truth being with Ali; Sunni sources on his superiority; and nineteen traditions in Sunni canonical books declaring his Imamate."]], ["Chapter 5: Disputed History of the First Caliphs", ["§The author’s case§Majlisi sets out his critique, which he calls indictments, of the first three caliphs, using Sunni and Shi’a sources. This section reflects the author’s Shi’a viewpoint, and others hold different views.", "§Abu Bakr§Nine points are discussed, including the delegation of duties, the army of Usama, Fadak, the allegiance and the choice of Umar as successor.", "§Umar and Uthman§Eleven points about Umar, including the Thursday incident and what the author calls innovations, and ten points about Uthman, including nepotism and the treatment of Abu Dharr, Ibn Mas’ud and Ammar."]], ["Chapter 5: The Twelve Imams, Occultation, Raj’a", ["§All the Imams§The Imamate of all twelve by nass, precedence, infallibility, miracles, knowledge and consensus on their excellence.", "§Occultation§A long section on the occultation of the Twelfth Imam.", "§Raj’a§The return (Raj’a) of some people before the Day of Judgment, argued from eight verses."]], ["Chapter 6: Resurrection and Death", ["§Physical resurrection§Proof of bodily resurrection and replies to objections.", "§Death§Everything will perish except God, and the throes of death."]], ["Chapter 6: Barzakh and the Last Day", ["§Barzakh§The survival of the soul, questioning in the grave with reward and punishment, and the location of the soul and facsimile body.", "§End of the world§Portents of judgment, the blowing of the trumpet, annihilation, events preceding Qiyamah, gathering of animals, and the circumstances of children and the mentally unsound."]], ["Chapter 6: Judgment, Paradise and Hell", ["§Judgment§The balance of deeds and accounting, questioning of prophets, intercession, the Hawd, the banner, and the Sirat bridge.", "§Paradise and Hell§Paradise and Hell described at length, the Heights (A’raf), and those condemned to Hell forever and those who will not stay there forever."]], ["Chapter 6: Faith, Sin and Repentance", ["§Faith and Islam§Faith and Islam, disbelief and apostasy: whether faith increases or decreases, the elements of sincere faith, the meaning of Islam, certainty, disbelief after faith, apostasy, and whether emulation is enough.", "§Sins§Smaller and greater sins, with a discussion of sorcery and miracles.", "§Repentance§The necessity of repentance, its conditions, types and ranks, the acceptance of repentance, acts God will not punish, and a conclusion on the universe after Qiyamah."]]], "pdf": "../assets/books/Haqq-al-Yaqin.pdf", "pg": [4, 19, 29, 51, 70, 125, 191, 329, 436, 461, 512, 657]}];
