<!DOCTYPE html>
<html lang="en" data-own-i18n>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b1c">
<meta name="description" content="The letters (tawqi'at) of Imam al-Mahdi (atfs) and the four special deputies of the Minor Occultation, from Shaykh al-Tusi's Kitab al-Ghayba, in Arabic, English and Urdu.">
<title>Research &amp; Preservation Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<link rel="stylesheet" href="../assets/css/menu.css">
<style>
:root{--bg:#060b1c;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--line:rgba(224,184,98,.3);--gold:#e0b862;--gold2:#f3d79a;--text:#e9ecf5;--muted:#a3adc8;--em:#2fbf9b;--glow:rgba(224,184,98,.3);
  --paper:#f1e3c0;--paper2:#e2cc98;--ink:#2e2110;--ink2:#6b5330}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7f3e8;--card:rgba(10,18,38,.04);--card2:rgba(10,18,38,.07);--line:rgba(150,110,30,.35);--gold:#94691a;--gold2:#6f4d0e;--text:#1a2340;--muted:#4c5675;--em:#0d7a60;--glow:rgba(154,113,32,.25)}}
:root[data-theme="light"]{--bg:#f7f3e8;--card:rgba(10,18,38,.04);--card2:rgba(10,18,38,.07);--line:rgba(150,110,30,.35);--gold:#94691a;--gold2:#6f4d0e;--text:#1a2340;--muted:#4c5675;--em:#0d7a60;--glow:rgba(154,113,32,.25)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 Inter,system-ui,sans-serif;overflow-x:hidden}
body.locked{overflow:hidden}
canvas#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,header{position:relative;z-index:1}
main{overflow-x:clip}
.ar,[lang=ar]{font-family:Amiri,serif;direction:rtl}
html.ur .u{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;line-height:2.15;letter-spacing:0;font-style:normal}
.back{position:fixed;top:18px;left:16px;z-index:1000;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:color-mix(in srgb,var(--bg) 72%,transparent);border:1px solid var(--line);
  font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;backdrop-filter:blur(8px)}
html.ur .back{letter-spacing:0;font-size:.85rem;padding:4px 14px}
.back:hover{color:var(--gold)}

/* hero */
.hero{min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5rem 1.2rem 3rem;overflow:hidden;background:radial-gradient(ellipse at 50% 115%,var(--glow),transparent 60%)}
.geo{position:absolute;width:min(92vw,620px);opacity:.1;animation:spin 150s linear infinite;color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.cal{width:min(94vw,640px);height:auto;position:relative}
.cal text{font-family:"Aref Ruqaa",Amiri,serif;font-size:96px;fill:transparent;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 4s ease forwards,fillin 1.4s 3.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:var(--gold)}}
.hk{position:relative;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:0;animation:up 1.2s 1s forwards}
h1{font:600 clamp(2rem,7vw,3.3rem)/1.15 "Cormorant Garamond",serif;margin:.3rem 0;position:relative;opacity:0;animation:up 1.2s 1.4s forwards}
html.ur h1{font-family:"Noto Nastaliq Urdu",serif;font-size:clamp(1.5rem,6vw,2.5rem);line-height:2}
.sub{color:var(--muted);max-width:44ch;position:relative;opacity:0;animation:up 1.2s 2s forwards;margin:.4rem auto 0}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.tabs{position:sticky;top:0;z-index:20;display:flex;justify-content:center;gap:.4rem;padding:.8rem 1rem;background:linear-gradient(var(--bg) 70%,transparent)}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.55rem 1.3rem;font:500 .95rem Inter,sans-serif;cursor:pointer;transition:.3s}
.tab[aria-selected=true]{background:var(--gold);color:var(--bg);border-color:var(--gold);box-shadow:0 0 22px var(--glow)}
html.ur .tab{font-family:"Noto Nastaliq Urdu",serif;padding:.2rem 1.3rem;font-size:1rem}
section.pane{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 5rem;scroll-margin-top:70px}
section.pane[hidden]{display:none}
.intro{max-width:64ch;margin:0 auto 2.4rem;text-align:center;color:var(--muted)}
.intro b{color:var(--gold);font-weight:500}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}

/* letters timeline */
.lt{position:relative;max-width:760px;margin:0 auto}
.lt::before{content:"";position:absolute;top:0;bottom:0;left:22px;width:2px;background:linear-gradient(var(--gold),var(--em),transparent)}
.era{position:relative;margin:2.2rem 0 1rem 56px;font:600 1.25rem "Cormorant Garamond",serif;color:var(--gold)}
html.ur .era{font:600 1.05rem/2 "Noto Nastaliq Urdu",serif}
.env{position:relative;display:block;width:calc(100% - 56px);margin:0 0 1.1rem 56px;text-align:start;cursor:pointer;color:var(--text);font:inherit;
  background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.3rem 1.1rem 1.3rem;transition:transform .35s,box-shadow .35s,border-color .35s}
.env:hover,.env:focus-visible{transform:translateX(6px);box-shadow:0 12px 32px var(--glow);border-color:var(--gold);outline:none}
.env::before{content:"";position:absolute;left:-41px;top:1.35rem;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--gold);box-shadow:0 0 12px var(--glow)}
.env .y{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
html.ur .env .y{letter-spacing:0;font-size:.8rem}
.env h3{margin:.15rem 0 .1rem;font:600 1.4rem/1.25 "Cormorant Garamond",serif}
html.ur .env h3{font:600 1.1rem/2 "Noto Nastaliq Urdu",serif}
.env .to{color:var(--muted);font-size:.9rem;margin:0}
.env .peek{display:block;margin-top:.6rem;font:400 1.15rem/1.9 "Aref Ruqaa",Amiri,serif;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;opacity:.85}
.env .seal{position:absolute;top:.9rem;right:1rem;width:34px;height:34px;opacity:.85}
html.ur .env .seal{right:auto;left:1rem}

/* reader */
.reader{position:fixed;inset:0;z-index:1500;background:radial-gradient(ellipse at 50% 0%,#1a1408,#05070f 70%);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;overscroll-behavior:contain}
.reader.open{opacity:1;visibility:visible}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;background:rgba(5,7,15,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(224,184,98,.3)}
.bar .sp{flex:1}
.ib{background:transparent;color:#e0b862;border:1px solid rgba(224,184,98,.35);border-radius:99px;min-width:38px;height:38px;padding:0 .9rem;font:500 .85rem Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;transition:.25s}
.ib:hover,.ib.on{border-color:#e0b862;background:rgba(255,255,255,.07)}
html.ur .ib{font-family:"Noto Nastaliq Urdu",serif}
.rd{max-width:860px;margin:0 auto;padding:2.2rem 1rem 6rem;color:#e9ecf5}
.rd .head{text-align:center;margin-bottom:1.6rem}
.rd .head .y{font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:#e0b862}
html.ur .rd .head .y{letter-spacing:0;font-size:.85rem}
.rd .head h2{font:600 clamp(1.6rem,5vw,2.3rem)/1.2 "Cormorant Garamond",serif;margin:.2rem 0 .3rem}
html.ur .rd .head h2{font:600 clamp(1.25rem,5vw,1.7rem)/2 "Noto Nastaliq Urdu",serif}
.rd .head .to{color:#a3adc8;margin:0}
.ctx{max-width:64ch;margin:0 auto 2.2rem;color:#c9cfe0;border:1px solid rgba(224,184,98,.3);border-radius:14px;padding:.9rem 1.2rem;background:rgba(255,255,255,.04);font-size:.95rem}

/* the parchment */
.sheet{position:relative;margin:0 auto;max-width:720px;padding:clamp(2rem,6vw,3.6rem) clamp(1.3rem,6vw,3.6rem) clamp(2.4rem,6vw,3.4rem);color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 45%),
    radial-gradient(ellipse at 85% 90%,rgba(120,80,20,.22),transparent 50%),
    radial-gradient(circle at 50% 50%,transparent 55%,rgba(110,70,20,.38) 100%),
    repeating-linear-gradient(0deg,rgba(90,60,20,.035) 0 2px,transparent 2px 5px),
    linear-gradient(170deg,var(--paper),var(--paper2));
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(90,60,20,.25),inset 0 0 60px rgba(110,70,20,.35);
  border-radius:4px 10px 6px 12px/10px 4px 12px 6px;transform:rotate(-.4deg);opacity:0;translate:0 30px;transition:opacity 1s,translate 1s}
.reader.open .sheet{opacity:1;translate:0 0}
.sheet::before,.sheet::after{content:"";position:absolute;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(110,70,20,.45),transparent)}
.sheet::before{top:1.1rem}.sheet::after{bottom:1.1rem}
.sheet .bism{display:block;text-align:center;font:700 1.5rem "Aref Ruqaa",serif;color:var(--ink2);margin-bottom:.6rem}
.sheet .tx{font:400 clamp(1.3rem,3.6vw,1.75rem)/2.15 "Aref Ruqaa",Amiri,serif;text-align:justify;text-align-last:center;direction:rtl;margin:0 0 1rem}
.sheet .tx.v{font-family:Amiri,serif;font-size:clamp(1.25rem,3.4vw,1.6rem)}
.sheet .tx .al{color:#7a4d10}
.sheet .gap{display:block;text-align:center;color:var(--ink2);letter-spacing:.6em;margin:.4rem 0 1rem}
.sheet .stamp{display:block;width:62px;height:62px;margin:1.4rem auto 0;opacity:.75}
.cap{max-width:640px;margin:1.2rem auto 0;text-align:center;color:#a3adc8;font-size:.82rem;font-style:italic}
html.ur .cap{font-style:normal}

.keys{max-width:680px;margin:2.6rem auto 0}
.keys h4,.trh{text-align:center;font:600 .74rem Inter,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#e0b862;margin:0 0 1rem}
html.ur .keys h4,html.ur .trh{letter-spacing:0;font:600 .95rem/2 "Noto Nastaliq Urdu",serif}
.key{position:relative;margin:0 0 .8rem;padding:.9rem 1.2rem .9rem 2.6rem;border-radius:14px;background:linear-gradient(90deg,rgba(224,184,98,.12),rgba(255,255,255,.03));border:1px solid rgba(224,184,98,.28);font:italic 500 1.2rem/1.5 "Cormorant Garamond",serif;color:#f3e7c9}
.key::before{content:"\201C";position:absolute;left:.8rem;top:.15rem;font-size:2.6rem;color:#e0b862;opacity:.6}
html.ur .key{font:400 1.02rem/2.2 "Noto Nastaliq Urdu",serif;padding:.7rem 2.6rem .7rem 1.2rem}
html.ur .key::before{left:auto;right:.8rem}
.trw{max-width:680px;margin:2.6rem auto 0}
.trw p{color:#c9cfe0;font:500 1.14rem/1.7 "Cormorant Garamond",serif;margin:0 0 1rem}
html.ur .trw p{font:400 1.02rem/2.2 "Noto Nastaliq Urdu",serif}
.srcl{max-width:680px;margin:2.4rem auto 0;padding-top:1.1rem;border-top:1px solid rgba(224,184,98,.3);text-align:center;color:#a3adc8;font-size:.85rem}
.srcl a{color:#e0b862}
.nav2{display:flex;justify-content:space-between;gap:.8rem;max-width:680px;margin:2.4rem auto 0}
.nav2 .ib{flex:1;height:auto;min-height:38px;padding:.55rem 1.1rem;border-radius:16px;justify-content:flex-start;text-align:start}
.nav2 .ib:last-child{justify-content:flex-end;text-align:end}
.nav2 small{display:block;color:#a3adc8;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase}
html.ur .nav2 small{letter-spacing:0}

/* deputies */
.tl{position:relative;margin:0 auto 3.4rem;max-width:900px;padding:2.4rem 0 1rem}
.tl .track{position:relative;height:4px;border-radius:4px;background:linear-gradient(90deg,#e0b862 0%,#e0b862 64%,#d9a35a 64%,#d9a35a 94%,#2fbf9b 94%,#2fbf9b 100%);box-shadow:0 0 14px var(--glow)}
.tl .m{position:absolute;top:2.4rem;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.tl .m i{display:block;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tl .m b{position:absolute;top:-1.9rem;font:600 .95rem "Cormorant Garamond",serif;color:var(--gold);white-space:nowrap}
.tl .m.m2 span{transform:translateX(-35%)}
.tl .m.m3 span{top:2.7rem;transform:translateX(-30%)}
.tl .m span{position:absolute;top:1.1rem;font-size:.72rem;color:var(--muted);white-space:nowrap;text-align:center;line-height:1.3}
html.ur .tl .m span{font-family:"Noto Nastaliq Urdu",serif;line-height:1.9}
.dg{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:4.4rem}
.dp{position:relative;text-align:center;padding:2.6rem 1.1rem 1.3rem;border-radius:120px 120px 18px 18px;border:1px solid var(--line);
  background:radial-gradient(ellipse 80% 45% at 50% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%),var(--card);transition:transform .35s,box-shadow .35s}
.dp:hover{transform:translateY(-6px);box-shadow:0 16px 40px var(--glow)}
.dp .num{position:absolute;top:-22px;left:50%;translate:-50% 0;width:44px;height:44px;display:grid;place-items:center;color:var(--gold);font:700 1.1rem Amiri,serif}
.dp .num::before,.dp .num::after{content:"";position:absolute;inset:5px;border:1px solid var(--gold);background:var(--bg)}
.dp .num::after{transform:rotate(45deg)}
.dp .num b{position:relative;z-index:1}
.dp .lamp{width:46px;height:46px;margin:0 auto .4rem;filter:drop-shadow(0 0 10px var(--glow))}
.dp .an{font:700 1.45rem/1.6 "Aref Ruqaa",Amiri,serif;color:var(--gold)}
.dp h3{margin:.1rem 0 0;font:600 1.3rem/1.25 "Cormorant Garamond",serif}
html.ur .dp h3{font:600 1.05rem/2 "Noto Nastaliq Urdu",serif}
.dp .k{color:var(--muted);font-size:.85rem}
.dp .role{margin:.6rem 0 .2rem;font:italic 500 1.05rem "Cormorant Garamond",serif;color:var(--gold2)}
html.ur .dp .role{font:400 .9rem/2 "Noto Nastaliq Urdu",serif}
.dp .span{font-size:.78rem;color:var(--muted)}
.dp .open{margin-top:1rem;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:.45rem 1.1rem;font:500 .85rem Inter,sans-serif;cursor:pointer;transition:.3s}
.dp .open:hover,.dp.sel .open{background:var(--gold);color:var(--bg)}
html.ur .dp .open{font-family:"Noto Nastaliq Urdu",serif;padding:.1rem 1.1rem}
.story{max-width:760px;margin:2.2rem auto 0;border:1px solid var(--line);border-radius:22px;padding:clamp(1.3rem,4vw,2.4rem);background:linear-gradient(180deg,var(--card2),var(--card));scroll-margin-top:80px;animation:up .6s}
.story[hidden]{display:none}
.story .sh{display:flex;align-items:center;gap:.9rem;margin-bottom:1.2rem}
.story .sh .an{font:700 1.7rem "Aref Ruqaa",Amiri,serif;color:var(--gold)}
.story .sh h3{margin:0;font:600 1.6rem/1.2 "Cormorant Garamond",serif}
html.ur .story .sh h3{font:600 1.2rem/2 "Noto Nastaliq Urdu",serif}
.story .sh .k{color:var(--muted);font-size:.85rem}
.q{margin:0 0 1.6rem;padding:1.3rem 1.4rem;border-radius:16px;background:rgba(224,184,98,.08);border:1px solid var(--line)}
.q .ar{font:400 1.45rem/2.1 "Aref Ruqaa",Amiri,serif;color:var(--gold2);text-align:center;margin:0 0 .6rem}
.q blockquote{margin:0;font:italic 500 1.2rem/1.55 "Cormorant Garamond",serif;text-align:center}
html.ur .q blockquote{font:400 1.02rem/2.2 "Noto Nastaliq Urdu",serif}
.q cite{display:block;text-align:center;color:var(--muted);font-size:.8rem;font-style:normal;margin-top:.5rem}
.q cite a,.life a,.restb a{color:var(--gold)}
.life{list-style:none;margin:0;padding:0}
.life li{position:relative;padding:0 0 1.1rem 1.6rem;color:var(--text)}
.life li::before{content:"";position:absolute;left:.2rem;top:.6rem;width:8px;height:8px;rotate:45deg;border:1px solid var(--gold)}
html.ur .life li{padding:0 1.6rem 1.1rem 0}
html.ur .life li::before{left:auto;right:.2rem}
.life small,.restb small{display:block;color:var(--muted);font-size:.78rem;margin-top:.2rem}
.restb{margin-top:.6rem;padding:1rem 1.2rem;border-radius:14px;border:1px dashed var(--line);color:var(--muted)}
.restb b{color:var(--gold);font-weight:500}
.final{margin:3rem auto 0;max-width:760px;text-align:center;padding:2.4rem 1.4rem;border-radius:24px;border:1px solid var(--gold);background:radial-gradient(circle at 50% 0%,var(--glow),transparent 70%),var(--card)}
.final .ar{font:700 clamp(1.8rem,6vw,2.6rem)/1.7 "Aref Ruqaa",Amiri,serif;color:var(--gold);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 24px var(--gold)}}
.final p{color:var(--muted);max-width:56ch;margin:.6rem auto 0}
.final a{color:var(--gold)}
@media (max-width:560px){.reader .bar .lbl{display:none}.tl .m span{display:none}.tl{padding-bottom:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hk,h1,.sub,.sheet{opacity:1!important;transform:none!important;translate:none!important}.cal text{fill:var(--gold);stroke-dashoffset:0}}
</style>
<script src="../assets/js/i18n.js"></script>
</head>
<body>
<canvas id="stars"></canvas>
<a class="back" href="../index.html" id="back">← Home</a>

<header class="hero">
  <svg class="geo" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width=".6" aria-hidden="true">
    <rect x="40" y="40" width="120" height="120"/><rect x="40" y="40" width="120" height="120" transform="rotate(45 100 100)"/>
    <circle cx="100" cy="100" r="62"/><circle cx="100" cy="100" r="30"/>
  </svg>
  <svg class="cal" viewBox="0 0 640 160" role="img" aria-label="In the handwriting of our master"><text x="320" y="110" text-anchor="middle">بِخَطِّ مَوْلَانَا</text></svg>
  <div class="hk" id="hk">Research &amp; Preservation Archive</div>
  <h1 id="h1">Letters from the Hidden Imam</h1>
  <p class="sub" id="sub">What the Imam of our time wrote during his occultation, and the four trusted men who carried his words.</p>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tL" aria-controls="letters" aria-selected="true">The Letters</button>
    <button class="tab" role="tab" id="tD" aria-controls="deputies" aria-selected="false">The Four Deputies</button>
  </div>
  <section class="pane" id="letters" role="tabpanel" aria-labelledby="tL">
    <p class="intro" id="lIntro"></p>
    <div class="lt" id="lt"></div>
  </section>
  <section class="pane" id="deputies" role="tabpanel" aria-labelledby="tD" hidden>
    <p class="intro" id="dIntro"></p>
    <div class="tl" id="tl" aria-hidden="true"><div class="track"></div></div>
    <div class="dg" id="dg"></div>
    <div id="stories"></div>
    <div class="final rv" id="final"></div>
  </section>
</main>

<div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="bar">
    <button class="ib" id="rClose" type="button" aria-label="Close">✕</button>
    <span class="sp"></span>
    <button class="ib" id="rShare" type="button"></button>
  </div>
  <article class="rd" id="rd"></article>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rosette" viewBox="0 0 40 40"><g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="9" y="9" width="22" height="22"/><rect x="9" y="9" width="22" height="22" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="6"/></g><circle cx="20" cy="20" r="2" fill="currentColor"/></symbol>
  <symbol id="lamp" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M24 4v6M18 10h12l3 6H15z"/><path d="M15 16c-3 8-2 16 9 22 11-6 12-14 9-22"/><path d="M20 38h8l-1 6h-6z"/></g><path d="M24 20c3 4 3 8 0 11-3-3-3-7 0-11z" fill="currentColor" opacity=".9"/></symbol>
</svg>

<script src="../assets/js/archive-data.js"></script>
<script>
